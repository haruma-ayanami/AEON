<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>

  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Назад"), k2: this.tr("Реквизиты P2P"), k3: this.tr("Язык интерфейса: русский. Переключить на английский"), k4: this.tr("Покупатель видит реквизиты только внутри сделки — после того как USDT заблокированы в эскроу."), k5: this.tr("СПОСОБЫ ОПЛАТЫ · 4"), k6: this.tr("Тестовый прототип: используйте вымышленные данные."), k7: this.tr("Добавить способ оплаты"), k8: this.tr("СБП"), k9: this.tr("Алексей Т. · +7 900 ••• •• 00 · [Банк]"), k10: this.tr("В 2 объявлениях"), k11: this.tr("Банковский перевод"), k12: this.tr("Счёт •• 4821 · [Банк]"), k13: this.tr("В 1 объявлении"), k14: this.tr("Карта"), k15: this.tr("•• 7712 · [Банк]"), k16: this.tr("Не используется"), k17: this.tr("Наличные"), k18: this.tr("Москва, м. Курская · до 50 000 ₽"), k19: this.tr("Реквизитов пока нет"), k20: this.tr("Чтобы продавать USDT через P2P, добавьте хотя бы один способ получения оплаты — СБП или банковский перевод. Покупатель увидит реквизиты только в активной сделке.") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark', isDefault: st === 'default', isEmpty: st === 'empty',

        { t: this.tr("Карта"), s: this.tr("•• 7712 · [Банк]"), u: this.tr("Не используется"), cls: 'c-off', d: 'M3 6h18v12H3zM3 10h18M7 15h3' },
        { t: this.tr("Наличные"), s: this.tr("Москва, м. Курская · до 50 000 ₽"), u: this.tr("Не используется"), cls: 'c-off', d: 'M3 7h18v10H3zM12 12m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0' }
      ]
    };
  }
}
</script>
