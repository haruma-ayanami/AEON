<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб — боковая панель</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="ws" aria-label="{{ L.k1 }}" style="width: 240px; min-height: 960px; box-sizing: border-box; padding: 24px 12px 16px; background: var(--canvas, #0A0C0B); border-right: 1px solid var(--bs, #232824); color: var(--t1, #F2F5F1); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 4px">
  <a class="ws-logo" href="web-wallet-home.dc.html" aria-label="{{ L.k2 }}" style="display: flex; align-items: center; gap: 10px; padding: 0 12px 24px; text-decoration: none; color: var(--t1, #F2F5F1)">
    <span aria-hidden="true" style="width: 22px; height: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px"><span style="background: var(--sig, #B6F36B); border-radius: 1px"></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span><span></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span><span style="background: var(--t1, #F2F5F1); border-radius: 1px"></span></span>
    <span class="ws-word" style="font: 600 18px 'Inter Tight', sans-serif; letter-spacing: 0.02em">AEON</span>
  </a>
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
    <a class="ws-item" href="{{ n.href }}" aria-current="{{ n.current }}" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{ n.fg }}; background: {{ n.bg }}; font: {{ n.font }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
      <span class="ws-lbl" style="flex: 1">{{ n.label }}</span><span class="ws-short" aria-hidden="true" style="display: none">{{ n.short }}</span>
      <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="ws-badge" style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--sig, #B6F36B); color: #0A0C0B; font: 600 12px Inter, sans-serif; display: inline-flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
    </a>
  </sc-for>
  <div class="ws-sp" style="flex: 1; min-height: 24px"></div>
  <div class="ws-tn" style="margin: 0 4px 12px; padding: 14px; border-radius: 16px; background: var(--raised, #1B1F1C); display: flex; flex-direction: column; gap: 6px">
    <span style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.06em; color: var(--tnf, #F5B941); display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 1px; background: var(--tnf, #F5B941)"></span>{{ L.k3 }}</span>
    <span style="font-size: 13px; line-height: 18px; color: var(--t2, #A3ACA5)">{{ L.k4 }}</span>
  </div>
  <button type="button" class="ws-help"  style="border: 0; background: transparent; font: inherit; color: inherit; text-align: inherit; cursor: pointer; padding: 0; width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--t2, #A3ACA5); font: 500 14px Inter, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg><span class="ws-lbl">{{ L.k5 }}</span></button>
  <a class="ws-me" href="web-profile.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 4px; border-radius: 14px; background: var(--raised, #1B1F1C); text-decoration: none; color: var(--t1, #F2F5F1)">
    <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 999px; background: var(--bd, #2E342F); display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">{{ L.k6 }}</span>
    <span class="ws-metext" style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 500">alex_tk</span><span style="font: 500 11px 'JetBrains Mono', monospace; color: var(--t3, #8A938C)">{{ L.k7 }}</span></span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["wallet", "p2p", "analytics", "notifications", "profile"], "default": "wallet"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "onLang": {"editor": null}, "$preview": {"width": 240, "height": 960}}'>
class Component extends DCLogic {
  static EN = {"Кошелёк": "Wallet", "Аналитика": "Analytics", "АТ": "AT", "ТЕСТОВАЯ СЕТЬ": "TESTNET", "Профиль": "Profile", "Разделы": "Sections", "AEON — на главную": "AEON — home", "Реальные деньги не используются": "No real money is used", "Помощь и руководство": "Help and guide", "KYC · УРОВЕНЬ 1": "KYC · LEVEL 1", "Уведомления": "Notifications", "Уведомл.": "Alerts"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Разделы"), k2: this.tr("AEON — на главную"), k3: this.tr("ТЕСТОВАЯ СЕТЬ"), k4: this.tr("Реальные деньги не используются"), k5: this.tr("Помощь и руководство"), k6: this.tr("АТ"), k7: this.tr("KYC · УРОВЕНЬ 1"), k8: this.tr("Кошелёк"), k9: this.tr("Аналитика"), k10: this.tr("Уведомления"), k11: this.tr("Профиль") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const active = this.props.active ?? 'wallet';
    const items = [
      { key: 'wallet', label: this.tr('Кошелёк'), href: 'web-wallet-home.dc.html', d: 'M3 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM3 9h15M16 12.5h2' },
      { key: 'p2p', label: 'P2P', href: 'web-p2p-market.dc.html', d: 'M4 8h13l-3-3M20 16H7l3 3', badge: '1' },
      { key: 'analytics', label: this.tr('Аналитика'), href: 'web-analytics-portfolio.dc.html', d: 'M4 19h16M6 15l4-5 3 3 5-7' },
      { key: 'notifications', label: this.tr('Уведомления'), href: 'web-notifications.dc.html', d: 'M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0', badge: '3' },
      { key: 'profile', label: this.tr('Профиль'), href: 'web-profile.dc.html', d: 'M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5' }
    ];
    return {
      items: items.map((n) => {
        const on = n.key === active;
        return {
          ...n,
          short: n.key === 'notifications' ? this.tr('Уведомл.') : n.label,
          hasBadge: !!n.badge,
          current: on ? 'page' : 'false',
          bg: on ? 'var(--raised, #1B1F1C)' : 'transparent',
          fg: on ? 'var(--t1, #F2F5F1)' : 'var(--t2, #A3ACA5)',
          font: on ? '600 15px Inter, sans-serif' : '500 15px Inter, sans-serif'
        };
      })
    };
  }
}
</script>
</body>
</html>
