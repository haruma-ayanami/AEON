        <div style="flex: 1; min-width: 0; overflow: hidden"><table class="tbl"><thead><tr><th>{{ L.k10 }}</th><th>{{ L.k11 }}</th><th>{{ L.k12 }}</th><th>{{ L.k13 }}</th><th>{{ L.k14 }}</th></tr></thead><tbody><sc-for list="{{ rows }}" as="r" hint-placeholder-count="8"><tr aria-selected="{{ r.sel }}" style="background: {{ r.bg }}"><td style="font-weight: 500">{{ r.op }}</td><td class="muted" style="font-size: 12px">{{ r.asset }}</td><td class="muted" style="font-size: 12px">{{ r.type }}</td><td><sc-if value="{{ r.edit }}" hint-placeholder-val="{{ false }}"><span class="winp" style="height: 30px; width: 120px; border-bottom: 2px solid var(--sigt)"><input aria-label="{{ L.k15 }}" defaultValue="{{ r.v }}"></span></sc-if><sc-if value="{{ r.view }}" hint-placeholder-val="{{ true }}"><span class="num" style="font-weight: 600">{{ r.v }}</span></sc-if><span class="faint" style="font-size: 11px; display: block">{{ r.was }}</span></td><td class="muted" style="font-size: 12px">{{ r.by }}</td></tr></sc-for></tbody></table></div>
