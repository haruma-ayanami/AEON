<div class="mob48 {{ themeClass }}" style="position: relative; width: 412px; height: 915px; overflow: hidden">

    <label style="position: relative; display: block"><span style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: var(--canvas); font-size: 12px; color: {{ pwC }}">{{ L.k6 }}</span><input type="password" value="aeon-test-2026" aria-invalid="{{ isError }}" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 48px 0 16px; border-radius: 8px; border: {{ pwB }}; background: transparent; color: var(--t1); font: 400 16px Inter, sans-serif; outline: none"><button aria-label="{{ L.k7 }}" style="position: absolute; right: 4px; top: 4px; width: 48px; height: 48px; border: 0; background: transparent; color: var(--t2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg></button><sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}"><span class="hint" style="display: block; padding: 4px 16px 0">{{ L.k8 }}</span></sc-if><sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><span role="alert" style="display: block; padding: 4px 16px 0; font-size: 12px; color: var(--neg)">{{ L.k14 }}</span></sc-if><sc-if value="{{ isLocked }}" hint-placeholder-val="{{ false }}"><span class="hint" style="display: block; padding: 4px 16px 0">{{ L.k8 }}</span></sc-if></label>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "error", "locked"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 412, "height": 915}}'>
class Component extends DCLogic {
  static EN = {"Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Назад": "Back", "Вход": "Sign in", "С возвращением": "Welcome back", "Электронная почта": "Email", "Пароль": "Password", "Показать пароль": "Show password", "Не меньше 8 символов, буквы и цифры": "At least 8 characters, letters and digits", "Забыли пароль?": "Forgot password?", "Войти": "Sign in", "Войти по отпечатку": "Sign in with fingerprint", "Нет аккаунта?": "No account?", "Создать": "Create one", "Неверная почта или пароль. Осталось 2 попытки": "Wrong email or password. 2 attempts left", "Вход заблокирован после 5 неудачных попыток. Повторите через": "Sign-in is locked after 5 failed attempts. Try again in", "или восстановите пароль.": "or reset your password."};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Назад"), k2: this.tr("Вход"), k3: this.tr("Язык интерфейса: русский. Переключить на английский"), k4: this.tr("С возвращением"), k5: this.tr("Электронная почта"), k6: this.tr("Пароль"), k7: this.tr("Показать пароль"), k8: this.tr("Не меньше 8 символов, буквы и цифры"), k9: this.tr("Забыли пароль?"), k10: this.tr("Войти"), k11: this.tr("Войти по отпечатку"), k12: this.tr("Нет аккаунта?"), k13: this.tr("Создать"), k14: this.tr("Неверная почта или пароль. Осталось 2 попытки"), k15: this.tr("Вход заблокирован после 5 неудачных попыток. Повторите через"), k16: this.tr("или восстановите пароль.") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    return { themeClass: theme === 'light' ? 'th-light' : 'th-dark', pwC: st === 'error' ? 'var(--neg)' : st === 'locked' ? 'var(--t2)' : 'var(--sigt)', pwB: st === 'error' ? '2px solid var(--neg)' : st === 'locked' ? '1px solid var(--bst)' : '2px solid var(--sigt)', inOp: st === 'locked' ? '0.4' : '1', inDis: st === 'locked' ? 'true' : 'false', isDefault: st === 'default', isError: st === 'error', isLocked: st === 'locked' };
  }
}
</script>
