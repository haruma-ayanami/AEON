<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Windows · Сделка продавца · выпуск с 2FA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1120px; height: 760px; overflow: hidden">
  <dc-import name="win-p2p-deal-seller" theme="{{ theme }}" status="release" lang="{{ lang }}" hint-size="1120px,760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1120, "height": 760}}'>
// Окно в исходный артборд win-p2p-deal-seller.dc.html в состоянии «status=release»: правьте оригинал, здесь он подключён как есть.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { theme: p.theme ?? "dark", lang: p.lang ?? "ru" };
  }
}
</script>
</body>
</html>
