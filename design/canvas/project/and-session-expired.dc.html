<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Android — сессия завершена</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="mob48 {{ themeClass }} " style="position: relative; width: 412px; height: 915px; overflow: hidden">
  <header style="position: absolute; left: 0; right: 0; top: 40px; height: 64px; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px 0 16px"><span class="testnet" style="margin-right: 8px">TESTNET</span><button onClick="{{ toggleLang }}" aria-label="{{ L.k1 }}" style="height: 40px; padding: 3px; margin-right: 8px; flex: none; box-sizing: border-box; border-radius: 999px; border: 1px solid var(--bst); background: transparent; display: flex; gap: 2px; cursor: pointer; font: 500 12px Inter, sans-serif"><span style="min-width: 36px; height: 32px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 36px; height: 32px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button></header>
  <div style="position: absolute; left: 24px; right: 24px; top: 120px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 20px; background: var(--infos); color: var(--info); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg></span>
    <h1 style="margin: 0; font: 400 32px Inter, sans-serif; line-height: 40px">{{ L.k2 }}</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--t2)">{{ L.k3 }}</p>
    <div style="border-radius: 24px; background: var(--surface); padding: 4px 16px; margin-top: 8px"><div class="rowline" style="min-height: 44px; align-items: center"><span>{{ L.k4 }}</span><span style="color: var(--t1); font-weight: 500">{{ L.k5 }}</span></div><div class="rowline" style="min-height: 44px; align-items: center"><span>{{ L.k6 }}</span><span style="color: var(--t1); font-weight: 500">Pixel 8 · Android 15</span></div><div class="rowline" style="min-height: 44px; align-items: center"><span>{{ L.k7 }}</span><span style="color: var(--warn); font-weight: 500">{{ L.k8 }}</span></div></div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 48px; display: flex; flex-direction: column; gap: 12px"><a href="and-auth.dc.html" class="btn btn-p" style="height: 52px">{{ L.k9 }}</a><a href="and-wallet-home.dc.html" class="btn" style="height: 52px; background: var(--sigs); color: var(--sigt)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v3M8.5 8.5a5 5 0 0 1 7.5 1.5M6 12a6 6 0 0 1 .6-2.6M18 13c0 3-1 5-2 6.5M9 14c0 2.5-.7 4.4-1.6 5.8M12 17c0 1.5-.3 3-.9 4"></path></svg>{{ L.k10 }}</a><span class="hint" style="text-align: center">{{ L.k11 }} <a href="and-profile.dc.html">{{ L.k12 }}</a></span></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 412, "height": 915}}'>
class Component extends DCLogic {
  static EN = {"Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Сессия завершена": "Session ended", "Вы не открывали AEON 15 минут или вошли на другом устройстве. Чтобы защитить средства, войдите снова.": "You haven't opened AEON for 15 minutes or signed in on another device. Sign in again to keep your funds safe.", "Последний вход": "Last sign-in", "сегодня, 12:41": "today, 12:41", "Устройство": "Device", "Новый вход": "New sign-in", "Windows 11 · 12:56": "Windows 11 · 12:56", "Войти снова": "Sign in again", "Войти по отпечатку": "Sign in with fingerprint", "Не вы входили с Windows 11?": "Wasn't you on Windows 11?", "Завершить все сессии": "End all sessions"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Язык интерфейса: русский. Переключить на английский"), k2: this.tr("Сессия завершена"), k3: this.tr("Вы не открывали AEON 15 минут или вошли на другом устройстве. Чтобы защитить средства, войдите снова."), k4: this.tr("Последний вход"), k5: this.tr("сегодня, 12:41"), k6: this.tr("Устройство"), k7: this.tr("Новый вход"), k8: this.tr("Windows 11 · 12:56"), k9: this.tr("Войти снова"), k10: this.tr("Войти по отпечатку"), k11: this.tr("Не вы входили с Windows 11?"), k12: this.tr("Завершить все сессии") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark'
    };
  }
}
</script>
</body>
</html>
