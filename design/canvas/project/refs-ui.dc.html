<helmet>

<style>body{margin:0}</style>
</helmet>
<div style="width: 1600px; min-height: 1440px; box-sizing: border-box; padding: 64px; background: #0A0C0B; color: #F2F5F1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.06em; color: #848D86">РЕФЕРЕНСЫ · ИНТЕРФЕЙСЫ · 9</span>
      <h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 48px; letter-spacing: -0.02em">Что берём из интерфейсов</h2>
    </div>
    <p style="margin: 0; max-width: 520px; font-size: 15px; line-height: 22px; color: #A3ACA5">Подборка от 23.10.2026. Номера совпадают с файлами в design/references и строками INDEX.md.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="9">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
        <div style="height: 420px; background: #131614; border: 1px solid #232824; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <img src="{{ it.src }}" alt="{{ it.alt }}" style="width: 100%; height: 100%; object-fit: contain">
        </div>
        <figcaption style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #B6F36B">{{ it.num }} · {{ it.kind }}</span>
          <span style="font-size: 14px; line-height: 20px; color: #A3ACA5">{{ it.take }}</span>
        </figcaption>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
