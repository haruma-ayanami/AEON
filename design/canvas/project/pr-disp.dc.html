<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прототип · Сценарий 6 · Спор (iOS)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="th-dark" style="width: 390px; height: 916px; overflow: hidden; background: var(--sunken)">
  <div style="height: 72px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--bs); background: var(--surface)">
    <button onClick="{{ back }}" disabled="{{ atFirst }}" aria-label="{{ t.back }}" class="ibtn" style="opacity: {{ backOp }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span class="lbl" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.scn }}</span>
      <span aria-live="polite" style="font: 600 14px Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.step }}</span>
      <div style="display: flex; gap: 3px">
        <sc-for list="{{ segs }}" as="g" hint-placeholder-count="5"><button onClick="{{ g.go }}" aria-label="{{ g.label }}" aria-current="{{ g.cur }}" style="flex: 1; height: 10px; padding: 3px 0; border: 0; background: transparent; cursor: pointer; box-sizing: border-box"><span style="display: block; height: 4px; border-radius: 2px; background: {{ g.bg }}"></span></button></sc-for>
      </div>
    </div>
    <button onClick="{{ restart }}" aria-label="{{ t.restart }}" class="ibtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"></path></svg></button>
  </div>
  <div style="position: relative; height: 844px; display: flex; justify-content: center; align-items: flex-start">
    <sc-if value="{{ on1 }}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; width: 390px; height: 844px; overflow: hidden">
  <dc-import name="ios-p2p-deal" status="payment_sent" lang="{{ lang }}" hint-size="390px,844px"></dc-import>

  <div class="th-dark" style="position: absolute; left: 12px; right: 12px; top: 52px; background: transparent">
    <button onClick="{{ go2 }}" style="width: 100%; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: var(--raised); border: 1px solid var(--bd); box-shadow: 0 16px 48px rgba(0,0,0,0.45); text-decoration: none; color: var(--t1)">
      <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--surface); color: var(--warn); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 17H2zM12 10v4M12 17v.5"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 14px Inter, sans-serif">{{ s1.ttitle }}</span><span style="font-size: 13px; line-height: 18px; color: var(--t2)">{{ s1.ttext }}</span></span>
      <span class="btn btn-s btn-p" style="flex: none">{{ s1.tcta }}</span>
    </button>
  </div>
</div>
    </sc-if>
    <sc-if value="{{ on2 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 390px; height: 844px; overflow: hidden">
  <dc-import name="ios-p2p-dispute" lang="{{ lang }}" hint-size="390px,844px"></dc-import>
  <button onClick="{{ go3 }}" aria-label="{{ s2.pr_disp_2_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 12px; top: 750px; width: 366px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>

</div>
    </sc-if>
    <sc-if value="{{ on3 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 390px; height: 844px; overflow: hidden">
  <dc-import name="ios-p2p-dispute" state="progress" lang="{{ lang }}" hint-size="390px,844px"></dc-import>
  <button onClick="{{ go4 }}" aria-label="{{ s3.pr_disp_3_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 89px; top: 750px; width: 289px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>

</div>
    </sc-if>
    <sc-if value="{{ on4 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 390px; height: 844px; overflow: hidden">
  <dc-import name="ios-p2p-dispute" state="progress" lang="{{ lang }}" hint-size="390px,844px"></dc-import>

  <div class="th-dark" style="position: absolute; left: 12px; right: 12px; top: 52px; background: transparent">
    <button onClick="{{ go5 }}" style="width: 100%; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: var(--raised); border: 1px solid var(--bd); box-shadow: 0 16px 48px rgba(0,0,0,0.45); text-decoration: none; color: var(--t1)">
      <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--surface); color: var(--sig); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 14px Inter, sans-serif">{{ s4.ttitle }}</span><span style="font-size: 13px; line-height: 18px; color: var(--t2)">{{ s4.ttext }}</span></span>
      <span class="btn btn-s btn-p" style="flex: none">{{ s4.tcta }}</span>
    </button>
  </div>
</div>
    </sc-if>
    <sc-if value="{{ on5 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 390px; height: 844px; overflow: hidden">
  <dc-import name="ios-p2p-deal" status="completed" lang="{{ lang }}" hint-size="390px,844px"></dc-import>


</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 916}}'>
// Кликабельный сценарий 6: шаги — окна в исходные экраны, подсвеченные зоны переключают шаг. Экраны правьте в оригиналах.
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? "ru";
    const en = lang === 'en';
    const n = 5;
    const step = Math.min(Math.max((this.state && this.state.step) || 1, 1), n);
    const go = (k) => () => this.setState({ step: k });
    const names = ["продавец молчит", "причина и чек", "запрос доказательств", "решение арбитра", "сделка завершена"];
    const namesEn = ["the seller is silent", "reason and receipt", "evidence request", "arbitrator decision", "deal completed"];
    const v = { lang };
    for (let k = 1; k <= n; k++) { v['on' + k] = step === k; v['go' + k] = go(k); }
    v.back = go(Math.max(step - 1, 1));
    v.restart = go(1);
    v.atFirst = step === 1;
    v.backOp = step === 1 ? '0.4' : '1';
    v.t = {
      scn: en ? "Scenario 6 · Dispute (iOS)" : "Сценарий 6 · Спор (iOS)",
      step: (en ? 'Step ' + step + ' of ' + n + ' · ' + namesEn[step - 1] : 'Шаг ' + step + ' из ' + n + ' · ' + names[step - 1]),
      back: en ? 'Previous step' : 'Предыдущий шаг',
      restart: en ? 'Start over' : 'Начать сначала'
    };
    v.segs = names.map((nm, i) => ({ go: go(i + 1), label: (en ? 'Step ' + (i + 1) + ': ' + namesEn[i] : 'Шаг ' + (i + 1) + ': ' + nm), cur: i + 1 === step ? 'step' : 'false', bg: i + 1 <= step ? 'var(--sigt)' : 'var(--bd)' }));
    v.s1 = { ttitle: en ? "15 minutes passed — USDT not released" : "Прошло 15 минут — USDT не выпущены", ttext: en ? "The seller didn’t confirm the payment. Open a dispute: the coins stay in escrow." : "Продавец не подтвердил оплату. Откройте спор: монеты останутся в эскроу.", tcta: en ? "Open dispute" : "Открыть спор" };
    v.s2 = { pr_disp_2_z0: en ? "Open dispute" : "Открыть спор" };
    v.s3 = { pr_disp_3_z0: en ? "Attach statement" : "Приложить выписку" };
    v.s4 = { ttitle: en ? "The arbitrator decided" : "Арбитр вынес решение", ttext: en ? "The statement confirms the payment. 250 USDT were released to you, dispute D-0203 is closed." : "Выписка подтверждает оплату. 250 USDT выпущены вам, спор D-0203 закрыт.", tcta: en ? "Open" : "Открыть" };
    return v;
  }
}
</script>
</body>
</html>
