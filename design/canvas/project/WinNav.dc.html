<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Windows — навигация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="{{ L.k1 }}" style="width: 220px; height: 852px; box-sizing: border-box; padding: 4px 4px 8px; background: var(--mica, #151917); color: var(--t1, #F2F5F1); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 2px">
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
    <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position: relative; height: 36px; margin: 0 4px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--t1, #F2F5F1); background: {{ n.bg }}; font: {{ n.font }}">
      <sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--sig, #B6F36B)"></span></sc-if>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
      <span style="flex: 1">{{ n.label }}</span>
      <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--sig, #B6F36B); color: #0A0C0B; font: 600 10px Inter, sans-serif; display: inline-flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
    </a>
  </sc-for>
  <div style="flex: 1"></div>
  <div style="margin: 0 8px 8px; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--bs, #232824); display: flex; flex-direction: column; gap: 4px; font-size: 11px">
    <span style="font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.06em; color: var(--t3, #8A938C)">{{ L.k2 }}</span>
    <span style="display: flex; align-items: center; gap: 6px; color: var(--t2, #A3ACA5)"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 1px; background: var(--sig, #B6F36B)"></span>Sepolia · Amoy · BSC</span>
    <span style="display: flex; align-items: center; gap: 6px; color: var(--t2, #A3ACA5)"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 1px; background: var(--sig, #B6F36B)"></span>Bitcoin Testnet · Devnet</span>
  </div>
  <button type="button" style="border: 0; background: transparent; font: inherit; color: inherit; text-align: inherit; cursor: pointer; padding: 0; height: 36px; margin: 0 4px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--t1, #F2F5F1); font: 400 13px Inter, sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg>{{ L.k3 }}</button>
  <a href="win-settings.dc.html" style="height: 36px; margin: 0 4px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--t1, #F2F5F1); font: 400 13px Inter, sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>{{ L.k4 }}</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["wallet", "p2p", "analytics", "notifications", "profile"], "default": "wallet"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "onLang": {"editor": null}, "$preview": {"width": 220, "height": 852}}'>
class Component extends DCLogic {
  static EN = {"Кошелёк": "Wallet", "Аналитика": "Analytics", "Профиль": "Profile", "Разделы": "Sections", "Уведомления": "Notifications", "СЕТИ": "NETWORKS", "Справка · F1": "Help · F1", "Настройки": "Settings"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Разделы"), k2: this.tr("СЕТИ"), k3: this.tr("Справка · F1"), k4: this.tr("Настройки"), k5: this.tr("Кошелёк"), k6: this.tr("Аналитика"), k7: this.tr("Уведомления"), k8: this.tr("Профиль") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const active = this.props.active ?? 'wallet';
    const items = [
      { key: 'wallet', label: this.tr('Кошелёк'), href: 'win-wallet-home.dc.html', d: 'M3 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM3 9h15M16 12.5h2' },
      { key: 'p2p', label: 'P2P', href: 'win-p2p-market.dc.html', d: 'M4 8h13l-3-3M20 16H7l3 3', badge: '1' },
      { key: 'analytics', label: this.tr('Аналитика'), href: 'win-analytics.dc.html', d: 'M4 19h16M6 15l4-5 3 3 5-7' },
      { key: 'notifications', label: this.tr('Уведомления'), href: 'win-notifications.dc.html', d: 'M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0', badge: '3' },
      { key: 'profile', label: this.tr('Профиль'), href: 'win-profile.dc.html', d: 'M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5' }
    ];
    return {
      items: items.map((n) => {
        const on = n.key === active;
        return { ...n, on, hasBadge: !!n.badge, current: on ? 'page' : 'false', bg: on ? 'var(--sel, rgba(255,255,255,0.06))' : 'transparent', font: on ? '600 13px Inter, sans-serif' : '400 13px Inter, sans-serif' };
      })
    };
  }
}
</script>
</body>
</html>
