<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 520}}'>
class Component extends DCLogic {
  static EN = {"PUSH-УВЕДОМЛЕНИЕ": "PUSH NOTIFICATION", "сейчас": "now", "Покупатель отметил оплату": "The buyer marked the payment", "P2P-48216 · проверьте поступление 9 240 ₽ и выпустите 100 USDT": "P2P-48216 · check the 9,240 ₽ payment and release 100 USDT", "LIVE ACTIVITY · АКТИВНАЯ СДЕЛКА": "LIVE ACTIVITY · ACTIVE DEAL", "Оплатите 23 100 ₽": "Pay 23,100 ₽", "P2P-48213 · crypto_mila · СБП": "P2P-48213 · crypto_mila · SBP", "250 USDT в эскроу · нажмите, чтобы открыть реквизиты": "250 USDT in escrow · tap to open payment details", "DYNAMIC ISLAND · КОМПАКТНО И РАЗВЁРНУТО": "DYNAMIC ISLAND · COMPACT AND EXPANDED", "Сделка P2P-48213": "Deal P2P-48213", "ждёт вашей оплаты": "awaiting your payment"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("PUSH-УВЕДОМЛЕНИЕ"), k2: this.tr("сейчас"), k3: this.tr("Покупатель отметил оплату"), k4: this.tr("P2P-48216 · проверьте поступление 9 240 ₽ и выпустите 100 USDT"), k5: this.tr("LIVE ACTIVITY · АКТИВНАЯ СДЕЛКА"), k6: this.tr("Оплатите 23 100 ₽"), k7: this.tr("P2P-48213 · crypto_mila · СБП"), k8: this.tr("250 USDT в эскроу · нажмите, чтобы открыть реквизиты"), k9: this.tr("DYNAMIC ISLAND · КОМПАКТНО И РАЗВЁРНУТО"), k10: this.tr("Сделка P2P-48213"), k11: this.tr("ждёт вашей оплаты") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    return { themeClass: theme === 'light' ? 'th-light' : 'th-dark' };
  }
}
</script>
