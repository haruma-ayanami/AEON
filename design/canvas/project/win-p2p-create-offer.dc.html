          <div style="display: flex; gap: 10px"><label class="wcard" style="flex: 1; padding: 14px; display: flex; gap: 10px; align-items: flex-start; border-color: var(--bst)"><span class="rb" aria-hidden="true" style="margin-top: 1px"></span><input type="radio" name="rt" class="sr"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{ L.k7 }}</span><span class="muted" style="font-size: 12px">{{ L.k8 }}</span></span></label><label class="wcard" style="flex: 1; padding: 14px; display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--sigt)"><span class="rb on" aria-hidden="true" style="margin-top: 1px"></span><input type="radio" name="rt" checked class="sr"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{ L.k9 }}</span><span class="muted" style="font-size: 12px">{{ L.k10 }}</span></span></label></div>

            <div class="rowline" style="font-size: 12px"><span>{{ L.k24 }}</span><span>{{ L.k25 }}</span></div>
            <div class="rowline" style="font-size: 12px"><span>{{ L.k26 }}</span><span>{{ L.k25 }}</span></div>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  static EN = {"AEON · Новое объявление": "AEON · New offer", "Новое объявление": "New offer", "Сохранить черновик": "Save draft", "Шаги": "Steps", "ШАГ 2 ИЗ 7": "STEP 2 OF 7", "Курс": "Rate", "Фиксированный": "Fixed", "Курс не меняется, пока вы его не измените": "The rate doesn't change until you change it", "Плавающий": "Floating", "Рынок ± процент, пересчёт каждую минуту": "Market ± percent, recalculated every minute", "Наценка к рынку": "Market margin", "От −5% до +5%": "From −5% to +5%", "Ваш курс": "Your rate", "Рынок 92,12 ₽ · обновлено 12:40": "Market 92.12 ₽ · updated 12:40", "КУРСЫ КОНКУРЕНТОВ · ПРОДАЖА USDT ЗА ₽": "COMPETITOR RATES · SELLING USDT FOR ₽", "Ваш курс на 3-м месте из 18": "Your rate ranks 3rd of 18", "ваш курс — 3-й из 18": "your rate — 3rd of 18", "Назад": "Back", "Далее: объём · Enter": "Next: volume · Enter", "Предпросмотр карточки": "Card preview", "ТАК ОБЪЯВЛЕНИЕ УВИДЯТ ПОКУПАТЕЛИ": "HOW BUYERS WILL SEE THE OFFER", "★ нет отзывов · новый продавец": "★ no reviews · new seller", "за 1 USDT": "per 1 USDT", "Доступно": "Available", "— шаг 3": "— step 3", "Лимиты": "Limits", "Оплата": "Payment", "— шаг 4": "— step 4", "Купить USDT": "Buy USDT", "Для продажи на балансе должно быть не меньше объёма объявления: сейчас доступно 1 250 USDT.": "To sell, your balance must cover the offer volume: 1,250 USDT is available now.", "ЧЕРНОВИК СОХРАНЁН 12:41": "DRAFT SAVED 12:41", "ENTER — ДАЛЕЕ · ESC — ОТМЕНА": "ENTER — NEXT · ESC — CANCEL", "Тип и актив": "Type and asset", "Объём и лимиты": "Volume and limits", "Способы оплаты": "Payment methods", "Время и условия": "Time and terms", "Предпросмотр": "Preview", "Публикация": "Publish"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("AEON · Новое объявление"), k2: this.tr("Новое объявление"), k3: this.tr("Сохранить черновик"), k4: this.tr("Шаги"), k5: this.tr("ШАГ 2 ИЗ 7"), k6: this.tr("Курс"), k7: this.tr("Фиксированный"), k8: this.tr("Курс не меняется, пока вы его не измените"), k9: this.tr("Плавающий"), k10: this.tr("Рынок ± процент, пересчёт каждую минуту"), k11: this.tr("Наценка к рынку"), k12: this.tr("От −5% до +5%"), k13: this.tr("Ваш курс"), k14: this.tr("Рынок 92,12 ₽ · обновлено 12:40"), k15: this.tr("КУРСЫ КОНКУРЕНТОВ · ПРОДАЖА USDT ЗА ₽"), k16: this.tr("Ваш курс на 3-м месте из 18"), k17: this.tr("ваш курс — 3-й из 18"), k18: this.tr("Назад"), k19: this.tr("Далее: объём · Enter"), k20: this.tr("Предпросмотр карточки"), k21: this.tr("ТАК ОБЪЯВЛЕНИЕ УВИДЯТ ПОКУПАТЕЛИ"), k22: this.tr("★ нет отзывов · новый продавец"), k23: this.tr("за 1 USDT"), k24: this.tr("Доступно"), k25: this.tr("— шаг 3"), k26: this.tr("Лимиты"), k27: this.tr("Оплата"), k28: this.tr("— шаг 4"), k29: this.tr("Купить USDT"), k30: this.tr("Для продажи на балансе должно быть не меньше объёма объявления: сейчас доступно 1 250 USDT."), k31: this.tr("ЧЕРНОВИК СОХРАНЁН 12:41"), k32: this.tr("ENTER — ДАЛЕЕ · ESC — ОТМЕНА"), k33: this.tr("Тип и актив"), k34: this.tr("Объём и лимиты"), k35: this.tr("Способы оплаты"), k36: this.tr("Время и условия"), k37: this.tr("Предпросмотр"), k38: this.tr("Публикация") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const names = [this.tr("Тип и актив"), this.tr("Курс"), this.tr("Объём и лимиты"), this.tr("Способы оплаты"), this.tr("Время и условия"), this.tr("Предпросмотр"), this.tr("Публикация")];
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      rail: names.map((t, i) => { const done = i < 1, cur = i === 1; return { t, n: done ? '✓' : String(i + 1), cur: cur ? 'step' : 'false', bg: cur ? 'var(--wsel)' : 'transparent', bd: done || cur ? 'var(--sig)' : 'var(--bst)', fill: done ? 'var(--sig)' : 'transparent', fc: done ? '#0A0C0B' : (cur ? 'var(--sigt)' : 'var(--t3)'), c: i > 1 ? 'var(--t3)' : 'var(--t1)', w: cur ? 600 : 400 }; }),
      comp: ['4%', '9%', '14%', '19%', '28%', '33%', '37%', '42%', '47%', '52%', '58%', '63%', '69%', '74%', '80%', '86%', '91%', '96%']
    };
  }
}
</script>
