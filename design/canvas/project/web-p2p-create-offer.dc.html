          <section style="display: flex; flex-direction: column; gap: 12px"><span class="lbl">{{ L.k7 }}</span>

            </div>

              <label class="field"><span>{{ L.k17 }}</span><span class="inp"><input value="50 000"><span class="muted">₽</span></span></label>
            </div>
          </section>
          <section style="display: flex; flex-direction: column; gap: 12px"><span class="lbl">{{ L.k18 }}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ pms }}" as="p" hint-placeholder-count="4"><label style="height: 48px; padding: 0 16px; border-radius: 14px; border: {{ p.b }}; display: flex; align-items: center; gap: 10px; cursor: pointer"><span class="cb {{ p.cls }}" aria-hidden="true"><sc-if value="{{ p.on }}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span><input type="checkbox" checked="{{ p.on }}" class="sr"><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">{{ p.name }}</span><span class="faint" style="font-size: 11px">{{ p.detail }}</span></span></label></sc-for><button type="button" class="btn btn-s btn-o" style="height: 48px; border-style: dashed">{{ L.k19 }}</button></div>

  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }

    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const bal = (this.props.error ?? 'none') === 'balance';
    return {

</script>
</body>
</html>
