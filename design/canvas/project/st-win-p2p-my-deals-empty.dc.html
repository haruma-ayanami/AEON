<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Windows · Мои сделки · пусто</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden">
  <dc-import name="win-p2p-my-deals" theme="{{ theme }}" state="empty" lang="{{ lang }}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 900}}'>
// Окно в исходный артборд win-p2p-my-deals.dc.html в состоянии «state=empty»: правьте оригинал, здесь он подключён как есть.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { theme: p.theme ?? "dark", lang: p.lang ?? "ru" };
  }
}
</script>
</body>
</html>
