<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS — разблокировка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="mob {{ themeClass }} phone dots">
  <div style="position: absolute; right: 16px; top: 52px; z-index: 2; display: flex; align-items: center; gap: 8px"><span class="testnet">TESTNET</span><button onClick="{{ toggleLang }}" aria-label="{{ L.k1 }}" style="height: 44px; padding: 4px; flex: none; box-sizing: border-box; border-radius: 999px; border: 0.5px solid var(--glb); background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh); display: flex; gap: 2px; cursor: pointer; font: 600 11px 'JetBrains Mono', monospace"><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button></div>
  <div style="position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <span aria-hidden="true" style="width: 40px; height: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px"><span style="background: var(--sig); border-radius: 2px"></span><span style="background: var(--t1); border-radius: 2px"></span><span style="background: var(--t1); border-radius: 2px"></span><span style="background: var(--t1); border-radius: 2px"></span><span></span><span style="background: var(--t1); border-radius: 2px"></span><span style="background: var(--t1); border-radius: 2px"></span><span style="background: var(--t1); border-radius: 2px"></span><span style="background: var(--t1); border-radius: 2px"></span></span>
    <h1 class="disp" style="margin: 0; font-size: 24px">{{ L.k2 }}</h1>
    <span class="muted" style="font-size: 15px">{{ subtitle }}</span>
    <div aria-label="{{ dotsLabel }}" role="img" style="display: flex; gap: 14px; padding-top: 10px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="6"><span style="width: 14px; height: 14px; border-radius: 4px; background: {{ d.bg }}; border: {{ d.b }}; box-sizing: border-box"></span></sc-for></div>
    <sc-if value="{{ isWrong }}" hint-placeholder-val="{{ false }}"><span class="hint err">{{ L.k3 }}</span></sc-if>
  </div>
  <div role="group" aria-label="{{ L.k4 }}" style="position: absolute; left: 50%; bottom: 96px; margin-left: -138px; width: 276px; display: grid; grid-template-columns: repeat(3, 76px); gap: 18px 24px">
    <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
      <sc-if value="{{ k.digit }}" hint-placeholder-val="{{ true }}"><button class="glass" aria-label="{{ k.v }}" style="width: 76px; height: 76px; border-radius: 999px; color: var(--t1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer"><span class="disp" style="font-size: 30px; font-weight: 500">{{ k.v }}</span><span class="mono faint" style="font-size: 9px; letter-spacing: 0.12em">{{ k.sub }}</span></button></sc-if>
      <sc-if value="{{ k.face }}" hint-placeholder-val="{{ false }}"><button aria-label="{{ L.k5 }}" style="width: 76px; height: 76px; border-radius: 999px; border: 0; background: transparent; color: var(--sig); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9v1.5M15 9v1.5M12 9v4h-1M9 15.5c1.8 1.4 4.2 1.4 6 0"></path></svg></button></sc-if>
      <sc-if value="{{ k.del }}" hint-placeholder-val="{{ false }}"><button aria-label="{{ L.k6 }}" style="width: 76px; height: 76px; border-radius: 999px; border: 0; background: transparent; color: var(--t1); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7zM12 9l5 6M17 9l-5 6"></path></svg></button></sc-if>
    </sc-for>
  </div>
  <a href="ios-auth-login.dc.html" style="position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 15px">{{ L.k7 }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["typing", "wrong"], "default": "typing"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  static EN = {"Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "С возвращением, alex_tk": "Welcome back, alex_tk", "Неверный код. Осталось 4 попытки": "Wrong code. 4 attempts left", "Цифровая клавиатура": "Number pad", "Разблокировать по Face ID": "Unlock with Face ID", "Стереть": "Delete", "Войти по паролю": "Sign in with password", "Введите код-пароль AEON": "Enter your AEON passcode", "Введено ": "Entered ", " из 6 цифр": " of 6 digits"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Язык интерфейса: русский. Переключить на английский"), k2: this.tr("С возвращением, alex_tk"), k3: this.tr("Неверный код. Осталось 4 попытки"), k4: this.tr("Цифровая клавиатура"), k5: this.tr("Разблокировать по Face ID"), k6: this.tr("Стереть"), k7: this.tr("Войти по паролю"), k8: this.tr("Введите код-пароль AEON"), k9: this.tr("Введено "), k10: this.tr(" из 6 цифр") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const wrong = (this.props.state ?? 'typing') === 'wrong';
    const filled = wrong ? 6 : 3;
    const subs = { 1: '', 2: 'ABC', 3: 'DEF', 4: 'GHI', 5: 'JKL', 6: 'MNO', 7: 'PQRS', 8: 'TUV', 9: 'WXYZ', 0: '' };
    const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((v) => ({ digit: true, face: false, del: false, v: String(v), sub: subs[v] }));
    keys.push({ digit: false, face: true, del: false }, { digit: true, face: false, del: false, v: '0', sub: '' }, { digit: false, face: false, del: true });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      isWrong: wrong,
      subtitle: this.tr('Введите код-пароль AEON'),
      dotsLabel: this.tr('Введено ') + filled + this.tr(' из 6 цифр'),
      dots: Array.from({ length: 6 }, (_, i) => ({ bg: i < filled ? (wrong ? 'var(--neg)' : 'var(--t1)') : 'transparent', b: i < filled ? '0' : '1.5px solid var(--bst)' })),
      keys
    };
  }
}
</script>
</body>
</html>
