<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Админ · Windows · выводы · компактное окно 1024 × 768</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="wrs" style="width: 1024px; height: 768px; overflow: hidden">
  <dc-import name="wadm-withdrawals" theme="{{ theme }}" lang="{{ lang }}" hint-size="1024px,768px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1024, "height": 768}}'>
// Адаптив: окно в wadm-withdrawals.dc.html, компактное окно 1024 × 768. Раскладку правьте в оригинале и в правилах .wrs в aeon.css.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { theme: p.theme ?? "dark", lang: p.lang ?? "ru" };
  }
}
</script>
</body>
</html>
