  <div class="ios-body" style="top: 118px">
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">

      <a href="ios-p2p-deal-seller.dc.html" class="icard" style="padding: 10px 12px; border-radius: 16px; display: flex; flex-direction: column; gap: 3px; text-decoration: none; color: var(--t1)"><span class="lbl" style="font-size: 10px">{{ L.k9 }}</span><span class="num" style="font-size: 15px; font-weight: 600">{{ L.k10 }}</span></a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "range": {"editor": "enum", "options": ["1d", "1w", "1m", "1y"], "default": "1m"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  static EN = {"Назад": "Back", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Подсказка": "Hint", "БАЛАНС · ВСЕ СЕТИ": "BALANCE · ALL NETWORKS", "1 250,00": "1,250.00", "≈ 115 500,00 ₽ · $1 250,00": "≈ 115,500.00 ₽ · $1,250.00", "ДОСТУПНО": "AVAILABLE", "1 100,00": "1,100.00", "В ЭСКРОУ": "IN ESCROW", "100,00": "100.00", "В ВЫВОДЕ": "WITHDRAWING", "50,00": "50.00", "График курса USDT": "USDT rate chart", "92,40 ₽": "92.40 ₽", "Период графика": "Chart period", "ещё 2 сети · Amoy 250,00": "2 more networks · Amoy 250.00", "1 000,00": "1,000.00", "История по активу": "Asset history", "Получить": "Receive", "Отправить": "Send", "Купить или продать через P2P": "Buy or sell via P2P", "ноя": "Nov", "мар": "Mar", "июл": "Jul", "окт": "Oct", "Курс USDT к рублю: от ": "USDT to ruble rate: from ", " до ": " to ", "1Д": "1D", "1Н": "1W", "1М": "1M", "1Г": "1Y", "Продажа P2P · в эскроу": "P2P sale · in escrow", "P2P-48216 · eva_s · 11:58": "P2P-48216 · eva_s · 11:58", "−100,00": "−100.00", "Вывод · на проверке": "Withdrawal · under review", "на 0x1b9C…0a91 · 10:40": "to 0x1b9C…0a91 · 10:40", "−50,00": "−50.00"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Назад"), k2: this.tr("Язык интерфейса: русский. Переключить на английский"), k3: this.tr("Подсказка"), k4: this.tr("БАЛАНС · ВСЕ СЕТИ"), k5: this.tr("1 250,00"), k6: this.tr("≈ 115 500,00 ₽ · $1 250,00"), k7: this.tr("ДОСТУПНО"), k8: this.tr("1 100,00"), k9: this.tr("В ЭСКРОУ"), k10: this.tr("100,00"), k11: this.tr("В ВЫВОДЕ"), k12: this.tr("50,00"), k13: this.tr("График курса USDT"), k14: this.tr("92,40 ₽"), k15: this.tr("Период графика"), k16: this.tr("ещё 2 сети · Amoy 250,00"), k17: this.tr("1 000,00"), k18: this.tr("История по активу"), k19: this.tr("Получить"), k20: this.tr("Отправить"), k21: this.tr("Купить или продать через P2P") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const range = this.props.range ?? '1m';
    const series = {
      '1d': [92.31, 92.28, 92.35, 92.33, 92.4, 92.38, 92.44, 92.41, 92.37, 92.42, 92.46, 92.4],
      '1w': [91.9, 92.05, 91.98, 92.12, 92.2, 92.15, 92.3, 92.26, 92.38, 92.33, 92.45, 92.4],
      '1m': [91.85, 91.6, 91.72, 91.95, 91.8, 91.62, 91.9, 92.1, 92.0, 91.88, 92.15, 92.3, 92.22, 92.05, 92.18, 92.36, 92.5, 92.41, 92.28, 92.35, 92.55, 92.62, 92.48, 92.4],
      '1y': [88.2, 89.4, 90.8, 92.6, 94.1, 93.2, 91.5, 90.2, 91.1, 92.9, 93.4, 92.4]
    };
    const xs = { '1d': ['00:00', '08:00', '16:00', '24:00'], '1w': ['21.10', '23.10', '25.10', '27.10'], '1m': ['27.09', '07.10', '17.10', '27.10'], '1y': [this.tr('ноя'), this.tr('мар'), this.tr('июл'), this.tr('окт')] };
    const chg = { '1d': '+0,1%', '1w': '+0,5%', '1m': '+0,6%', '1y': '+4,8%' };
    const pts = series[range] || series['1m'];
    const lo = Math.min(...pts), hi = Math.max(...pts), pad = (hi - lo) * 0.15 || 0.1;
    const min = lo - pad, max = hi + pad;
    const y = (p) => (200 - ((p - min) / (max - min)) * 200).toFixed(1);
    const step = 600 / (pts.length - 1);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + y(p)).join(' ');
    const fmt = (n) => (this._lang === 'en' ? n.toFixed(2) : n.toFixed(2).replace('.', ','));
    const c = chg[range] || chg['1m'];
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      chg: this._lang === 'en' ? c.replace(',', '.') : c,
      line, area: line + ' L600 200 L0 200 Z',
      xs: xs[range] || xs['1m'],
      chartAria: this.tr('Курс USDT к рублю: от ') + fmt(lo) + this.tr(' до ') + fmt(hi) + ' ₽',
      ranges: [['1d', this.tr('1Д')], ['1w', this.tr('1Н')], ['1m', this.tr('1М')], ['1y', this.tr('1Г')]].map(([k, t]) => ({ t, sel: k === range ? 'true' : 'false', bg: k === range ? 'var(--pbg)' : 'transparent', fg: k === range ? 'var(--pfg)' : 'var(--t2)' })),
      rows: [
        { title: this.tr('Продажа P2P · в эскроу'), sub: this.tr('P2P-48216 · eva_s · 11:58'), amt: this.tr('−100,00'), ac: 'var(--t1)', d: 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3' },
        { title: this.tr('Вывод · на проверке'), sub: this.tr('на 0x1b9C…0a91 · 10:40'), amt: this.tr('−50,00'), ac: 'var(--t1)', d: 'M7 17L17 7M9 7h8v8' }
      ]
    };
  }
}
</script>
