<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AEON для Windows — уведомления</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="{{ themeClass }} wwin" style="width: 1440px; height: 900px">
  <dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="WinTitleBar" heading="{{ L.k1 }}" hint-size="1440px,48px"></dc-import>
  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="WinNav" active="notifications" hint-size="220px,852px"></dc-import>
    <main class="wlayer">
      <div style="padding: 22px 28px 12px; display: flex; align-items: center; gap: 8px"><h1 class="disp" style="margin: 0; font-size: 28px; flex: 1">{{ L.k2 }}</h1><button class="wbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{ L.k3 }}</button><button class="wbtn">{{ L.k4 }}</button></div>
      <div style="flex: 1; min-height: 0; display: flex; gap: 16px; padding: 4px 28px 20px">
        <nav aria-label="{{ L.k5 }}" style="width: 220px; flex: none; display: flex; flex-direction: column; gap: 2px"><sc-for list="{{ cats }}" as="c" hint-placeholder-count="5"><button type="button" aria-current="{{ c.cur }}" style="border: 0; background: transparent; font: inherit; color: inherit; text-align: inherit; cursor: pointer; padding: 0; width: 100%; box-sizing: border-box; height: 36px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 10px; text-decoration: none; background: {{ c.bg }}; font-weight: {{ c.w }}"><span style="flex: 1">{{ c.t }}</span><span class="faint">{{ c.n }}</span></button></sc-for>
          <div style="margin-top: 14px; padding: 12px; border-radius: 6px; border: 1px solid var(--bs); display: flex; flex-direction: column; gap: 8px"><span class="lbl" style="font-size: 10px">{{ L.k6 }}</span><span style="display: flex; align-items: center; gap: 8px"><span class="cb on" aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>{{ L.k7 }}</span><span style="display: flex; align-items: center; gap: 8px"><span class="cb on" aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>{{ L.k8 }}</span><span style="display: flex; align-items: center; gap: 8px"><span class="cb" aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px"></span>Telegram</span></div>
        </nav>
        <section class="wcard" style="flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column">
          <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center"><span aria-hidden="true" class="dots" style="width: 72px; height: 72px; border-radius: 18px; border: 1px dashed var(--bst); display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg></span><span style="font: 600 17px Inter, sans-serif">{{ L.k9 }}</span><span class="muted" style="max-width: 360px">{{ L.k10 }}</span></div>
          </sc-if>
          <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column"><sc-for list="{{ groups }}" as="g" hint-placeholder-count="2"><div style="display: flex; flex-direction: column"><span class="lbl" style="padding: 14px 16px 6px; border-bottom: 1px solid var(--bs)">{{ g.day }}</span><sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3"><a href="{{ n.href }}" style="display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--bs); text-decoration: none; background: {{ n.bg }}"><span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 8px; background: var(--raised); color: {{ n.ic }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: {{ n.w }}">{{ n.t }}</span><span class="muted">{{ n.s }}</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span class="faint mono" style="font-size: 11px">{{ n.time }}</span><sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span aria-label="{{ L.k11 }}" style="width: 8px; height: 8px; border-radius: 999px; background: var(--sig)"></span></sc-if></span></a></sc-for></div></sc-for></div>
          </sc-if>
        </section>
      </div>
      <footer class="wstatus"><span>{{ statusLeft }}</span><span style="flex: 1"></span><span>{{ L.k12 }}</span></footer>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 900}}'>

  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');

    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const empty = (this.props.state ?? 'default') === 'empty';
    const cat = (t, n, cur) => ({ t, n, cur: cur ? 'page' : 'false', bg: cur ? 'var(--wsel)' : 'transparent', w: cur ? 600 : 400 });
    const it = (t, s, time, d, ic, unread, href) => ({ t, s, time, d, ic, unread, w: unread ? 600 : 500, bg: unread ? 'var(--sel)' : 'transparent', href: href || '#' });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      isEmpty: empty, hasItems: !empty, statusLeft: empty ? this.tr("ВСЕ ПРОЧИТАНЫ") : this.tr("3 НЕПРОЧИТАННЫХ"),
      cats: [cat(this.tr("Все"), empty ? '0' : '6', true), cat(this.tr("Сделки"), empty ? '0' : '2'), cat(this.tr("Кошелёк"), empty ? '0' : '2'), cat(this.tr("Безопасность"), empty ? '0' : '1'), cat(this.tr("Система"), empty ? '0' : '1')],

        { day: this.tr("СЕГОДНЯ"), items: [it(this.tr("Покупатель отметил оплату"), this.tr("P2P-48190 · 500 USDT · проверьте поступление 46 000 ₽"), '12:58', 'M4 8h13l-3-3M20 16H7l3 3', 'var(--sigt)', true, 'win-p2p-deal-seller.dc.html'), it(this.tr("Новое сообщение в сделке"), this.tr("crypto_mila: «Реквизиты в карточке, жду оплату»"), '12:51', 'M4 5h16v11H8l-4 4z', 'var(--t1)', true, 'win-p2p-deal.dc.html'), it(this.tr("Вход с нового устройства"), this.tr("Windows 11 · Москва · если это не вы, завершите сеанс"), '12:02', 'M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6z', 'var(--warn)', true, 'win-profile.dc.html'), it(this.tr("Депозит 0,05 ETH зачислен"), this.tr("Sepolia · 12 из 12 подтверждений"), '10:14', 'M12 4v12M7 11l5 5 5-5M5 20h14', 'var(--sigt)', false)] },

      ]
    };
  }
}
</script>
</body>
