<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб · светлая · Маркетплейс</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; min-height: 1240px">
  <dc-import name="web-p2p-market" theme="{{ theme }}" lang="{{ lang }}" hint-size="100%,1240px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "light"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 1240}}'>
// Окно в исходный артборд web-p2p-market.dc.html в состоянии «светлая тема»: правьте оригинал, здесь он подключён как есть.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { theme: p.theme ?? "light", lang: p.lang ?? "ru" };
  }
}
</script>
</body>
</html>
