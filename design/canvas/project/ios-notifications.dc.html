<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS — уведомления</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="mob {{ themeClass }} phone">
  <div class="ios-body" style="top: 160px">
    <div style="display: flex; gap: 6px"><button class="btn btn-s btn-p">{{ L.k1 }}</button><button class="btn btn-s btn-o">{{ L.k2 }}</button><button class="btn btn-s btn-o">{{ L.k3 }}</button><button class="btn btn-s btn-o">{{ L.k4 }}</button></div>
<sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 12px">
    <span class="lbl" style="padding: 4px 4px 0">{{ L.k5 }}</span>
    <div class="icard">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" class="irow" style="align-items: flex-start; padding-top: 14px; padding-bottom: 14px; background: {{ n.bg }}">
          <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: {{ n.ib }}; color: {{ n.ic }}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: {{ n.w }}; font-size: 15px">{{ n.t }}</span><span class="faint" style="font-size: 12px">{{ n.time }}</span></span><span class="muted" style="font-size: 13px; line-height: 18px">{{ n.text }}</span></span>
        </a>
      </sc-for>
    </div></div></sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding: 48px 20px 28px; border-radius: 22px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><span aria-hidden="true" class="dots" style="width: 72px; height: 72px; border-radius: 22px; border: 1px dashed var(--bst); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg></span><span style="font-weight: 600; font-size: 17px">{{ L.k24 }}</span><span style="font-size: 14px; line-height: 20px; color: var(--t2); max-width: 420px">{{ L.k25 }}</span><button style="height: 48px; padding: 0 20px; border-radius: 999px; font: 600 15px Inter, sans-serif; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; margin-top: 6px; border: 0; background: var(--raised); color: var(--t1); cursor: pointer">{{ L.k26 }}</button></div></sc-if>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 156px; background: linear-gradient(180deg, var(--fade) 78%, transparent)"></div>
  <h1 class="disp" style="position: absolute; left: 16px; right: 16px; top: 108px; margin: 0; font-size: 30px; line-height: 36px">{{ L.k6 }}</h1><div class="ios-nav"><span style="flex: 1; display: flex"><span class="testnet">TESTNET</span></span><a href="ios-notification-settings.dc.html" aria-label="{{ L.k7 }}" class="gbtn glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a><button onClick="{{ toggleLang }}" aria-label="{{ L.k8 }}" style="height: 44px; padding: 4px; flex: none; box-sizing: border-box; border-radius: 999px; border: 0.5px solid var(--glb); background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh); display: flex; gap: 2px; cursor: pointer; font: 600 11px 'JetBrains Mono', monospace"><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button><button aria-label="{{ L.kh }}" class="gbtn glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg></button></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="IosTabBar" active="notifications" hint-size="390px,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  static EN = {"Подсказка по разделу": "Section help", "Сделки": "Deals", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Кошелёк": "Wallet", "Все": "All", "Вход с нового устройства": "Sign-in from a new device", "вчера": "yesterday", "4 мин": "4 min", "Безопасность": "Security", "СЕГОДНЯ": "TODAY", "Уведомления": "Notifications", "Настройки уведомлений": "Notification settings", "Продавец ждёт оплату": "The seller is waiting for payment", "P2P-48213 · осталось 04:12": "P2P-48213 · 04:12 left", "2 мин": "2 min", "Депозит обнаружен": "Deposit detected", "+0,05 ETH · подтверждения 3/12": "+0.05 ETH · confirmations 3/12", "Windows 11 · Москва. Не вы? Завершите сессию.": "Windows 11 · Moscow. Not you? End the session.", "42 мин": "42 min", "Вывод на проверке": "Withdrawal under review", "0,0012 BTC · решение до 11:30": "0.0012 BTC · decision by 11:30", "3 ч": "3 h", "Вывод выполнен": "Withdrawal completed", "−250 USDT · Ledger тест": "−250 USDT · Ledger test", "Новых уведомлений нет": "No new notifications", "Сообщим о статусе сделок, зачислениях и входах с новых устройств — в приложении и push.": "We'll notify you about deal status, deposits and sign-ins from new devices — in the app and via push.", "Настроить уведомления": "Notification settings"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Все"), k2: this.tr("Сделки"), k3: this.tr("Кошелёк"), k4: this.tr("Безопасность"), k5: this.tr("СЕГОДНЯ"), k6: this.tr("Уведомления"), k7: this.tr("Настройки уведомлений"), k8: this.tr("Язык интерфейса: русский. Переключить на английский"), k9: this.tr("Продавец ждёт оплату"), k10: this.tr("P2P-48213 · осталось 04:12"), k11: this.tr("2 мин"), k12: this.tr("Депозит обнаружен"), k13: this.tr("+0,05 ETH · подтверждения 3/12"), k14: this.tr("4 мин"), k15: this.tr("Вход с нового устройства"), k16: this.tr("Windows 11 · Москва. Не вы? Завершите сессию."), k17: this.tr("42 мин"), k18: this.tr("Вывод на проверке"), k19: this.tr("0,0012 BTC · решение до 11:30"), k20: this.tr("3 ч"), k21: this.tr("Вывод выполнен"), k22: this.tr("−250 USDT · Ledger тест"), k23: this.tr("вчера"), k24: this.tr("Новых уведомлений нет"), k25: this.tr("Сообщим о статусе сделок, зачислениях и входах с новых устройств — в приложении и push."), k26: this.tr("Настроить уведомления"), kh: this.tr("Подсказка по разделу") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    const n = (t, text, time, href, d, ib, ic, unread) => ({ t, text, time, href, d, ib, ic, w: unread ? '600' : '500', bg: unread ? 'var(--sel)' : 'transparent' });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark', isDefault: st === 'default', isEmpty: st === 'empty',
      items: [
        n(this.tr('Продавец ждёт оплату'), this.tr('P2P-48213 · осталось 04:12'), this.tr('2 мин'), 'ios-p2p-deal.dc.html', 'M4 8h13l-3-3M20 16H7l3 3', 'var(--warns)', 'var(--warn)', true),
        n(this.tr('Депозит обнаружен'), this.tr('+0,05 ETH · подтверждения 3/12'), this.tr('4 мин'), 'ios-tx-detail.dc.html', 'M17 7L7 17M7 9v8h8', 'var(--infos)', 'var(--info)', true),
        n(this.tr('Вход с нового устройства'), this.tr('Windows 11 · Москва. Не вы? Завершите сессию.'), this.tr('42 мин'), '#', 'M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6z', 'var(--negs)', 'var(--neg)', true),
        n(this.tr('Вывод на проверке'), this.tr('0,0012 BTC · решение до 11:30'), this.tr('3 ч'), '#', 'M7 17L17 7M9 7h8v8', 'var(--warns)', 'var(--warn)', false),
        n(this.tr('Вывод выполнен'), this.tr('−250 USDT · Ledger тест'), this.tr('вчера'), '#', 'M5 12l5 5 9-10', 'var(--sigs)', 'var(--sigt)', false)
      ]
    };
  }
}
</script>
</body>
</html>
