<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Android — нижняя навигация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="{{ L.k1 }}" style="width: 412px; height: 80px; box-sizing: border-box; background: var(--surface, #131614); border-top: 1px solid var(--bs, #232824); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; font-family: Inter, system-ui, sans-serif">
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
    <a href="{{ n.href }}" aria-current="{{ n.cur }}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{ n.fg }}; font: {{ n.font }}">
      <span style="position: relative; width: 56px; height: 32px; border-radius: 999px; background: {{ n.bg }}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg><sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 2px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--neg, #FF7A6B); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if></span>{{ n.label }}
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["wallet", "p2p", "analytics", "notifications", "profile"], "default": "wallet"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "onLang": {"editor": null}, "$preview": {"width": 412, "height": 80}}'>
class Component extends DCLogic {
  static EN = {"Основные разделы": "Main sections", "Кошелёк": "Wallet", "Аналитика": "Analytics", "Уведомл.": "Alerts", "Профиль": "Profile"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Основные разделы"), k2: this.tr("Кошелёк"), k3: this.tr("Аналитика"), k4: this.tr("Уведомл."), k5: this.tr("Профиль") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const active = this.props.active ?? 'wallet';
    const items = [
      { key: 'wallet', label: this.tr('Кошелёк'), href: 'and-wallet-home.dc.html', d: 'M3 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM3 9h15M16 12.5h2' },
      { key: 'p2p', label: 'P2P', href: 'and-p2p-market.dc.html', d: 'M4 8h13l-3-3M20 16H7l3 3', badge: '1' },
      { key: 'analytics', label: this.tr('Аналитика'), href: 'and-analytics.dc.html', d: 'M4 19h16M6 15l4-5 3 3 5-7' },
      { key: 'notifications', label: this.tr('Уведомл.'), href: 'and-notifications.dc.html', d: 'M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0', badge: '3' },
      { key: 'profile', label: this.tr('Профиль'), href: 'and-profile.dc.html', d: 'M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5' }
    ];
    return { items: items.map((n) => { const on = n.key === active; return { ...n, hasBadge: !!n.badge, cur: on ? 'page' : 'false', bg: on ? 'var(--sigs, rgba(182,243,107,.12))' : 'transparent', fg: on ? 'var(--t1, #F2F5F1)' : 'var(--t2, #A3ACA5)', font: on ? '600 12px Inter, sans-serif' : '500 12px Inter, sans-serif' }; }) };
  }
}
</script>
</body>
</html>
