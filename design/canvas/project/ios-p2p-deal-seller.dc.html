<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "status": {"editor": "enum", "options": ["paid", "release"], "default": "paid"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>

  static EN = {"Назад": "Back", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Чат с покупателем, 2 новых": "Chat with the buyer, 2 new", "ВЫ ПРОДАЁТЕ · EVA_S": "YOU ARE SELLING · EVA_S", "Оплата отправлена": "Payment sent", "100,00 USDT": "100.00 USDT", "за 9 240,00 ₽ · курс 92,40 ₽ · СБП": "for 9,240.00 ₽ · rate 92.40 ₽ · SBP", "На проверку оплаты осталось 12 минут 5 секунд": "12 minutes 5 seconds left to verify the payment", "НА ПРОВЕРКУ ОПЛАТЫ": "TO VERIFY PAYMENT", "Этапы сделки": "Deal stages", "Покупатель отметил оплату в 11:58": "The buyer marked the payment at 11:58", "Проверьте поступление в банке. Чек в чате можно подделать.": "Check your bank for the transfer. A receipt in the chat can be forged.", "Что проверить в банке": "What to check in your bank", "Выпуск необратим и подтверждается Face ID.": "Release is irreversible and confirmed with Face ID.", "Спор": "Dispute", "Выпустить 100 USDT": "Release 100 USDT", "Выпустить 100 USDT покупателю eva_s?": "Release 100 USDT to buyer eva_s?", "Убедитесь, что 9 240,00 ₽ уже на вашем счёте. Отменить выпуск нельзя.": "Make sure 9,240.00 ₽ is already in your account. The release can't be undone.", "Я проверил поступление 9 240,00 ₽ в банке": "I checked that 9,240.00 ₽ arrived in my bank", "Выпустить с Face ID": "Release with Face ID", "Отмена": "Cancel", "Создана": "Created", "В эскроу": "In escrow", "Оплачено": "Paid", "Завершена": "Completed", "Ровно 9 240,00 ₽": "Exactly 9,240.00 ₽", "другая сумма — повод для спора": "a different amount is grounds for a dispute", "Отправитель — Ева С.": "Sender — Eva S.", "совпадает с верифицированным именем": "matches the verified name", "Деньги уже на счёте": "Money is already in the account", "СБП · Т-Банк · +7 900 000-00-00": "SBP · T-Bank · +7 900 000-00-00"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Назад"), k2: this.tr("Язык интерфейса: русский. Переключить на английский"), k3: this.tr("Чат с покупателем, 2 новых"), k4: this.tr("ВЫ ПРОДАЁТЕ · EVA_S"), k5: this.tr("Оплата отправлена"), k6: this.tr("100,00 USDT"), k7: this.tr("за 9 240,00 ₽ · курс 92,40 ₽ · СБП"), k8: this.tr("На проверку оплаты осталось 12 минут 5 секунд"), k9: this.tr("НА ПРОВЕРКУ ОПЛАТЫ"), k10: this.tr("Этапы сделки"), k11: this.tr("Покупатель отметил оплату в 11:58"), k12: this.tr("Проверьте поступление в банке. Чек в чате можно подделать."), k13: this.tr("Что проверить в банке"), k14: this.tr("Выпуск необратим и подтверждается Face ID."), k15: this.tr("Спор"), k16: this.tr("Выпустить 100 USDT"), k17: this.tr("Выпустить 100 USDT покупателю eva_s?"), k18: this.tr("Убедитесь, что 9 240,00 ₽ уже на вашем счёте. Отменить выпуск нельзя."), k19: this.tr("Я проверил поступление 9 240,00 ₽ в банке"), k20: this.tr("Выпустить с Face ID"), k21: this.tr("Отмена") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const status = this.props.status ?? 'paid';
    const labels = [this.tr('Создана'), this.tr('В эскроу'), this.tr('Оплачено'), this.tr('Завершена')];
    const steps = labels.map((label, i) => ({ label, current: i === 2 ? 'step' : 'false', bar: i < 2 ? 'var(--sig)' : i === 2 ? 'var(--t1)' : 'var(--bd)', w: i === 2 ? 600 : 500, fg: i <= 2 ? 'var(--t1)' : 'var(--t3)' }));
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      isRelease: status === 'release',
      bars: Array.from({ length: 30 }, (_, i) => (i < 24 ? 'var(--warn)' : 'var(--bd)')),
      steps,
      checks: [
        { t: this.tr('Ровно 9 240,00 ₽'), s: this.tr('другая сумма — повод для спора') },
        { t: this.tr('Отправитель — Ева С.'), s: this.tr('совпадает с верифицированным именем') },
        { t: this.tr('Деньги уже на счёте'), s: this.tr('СБП · Т-Банк · +7 900 000-00-00') }
      ]
    };
  }
}
