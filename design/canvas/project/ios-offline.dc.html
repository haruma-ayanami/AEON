<!doctype html>
<html lang="ru">

<link rel="stylesheet" href="./aeon.css">
</head>

<helmet>

<div class="mob {{ themeClass }} phone">

  </sc-if>
  <sc-if value="{{ isOffline }}" hint-placeholder-val="{{ false }}">
    <div class="ios-nav"><span class="disp" style="flex: 1; font-size: 28px">{{ L.k3 }}</span><span class="testnet">TESTNET</span><button onClick="{{ toggleLang }}" aria-label="{{ L.k1 }}" style="height: 44px; padding: 4px; flex: none; box-sizing: border-box; border-radius: 999px; border: 0.5px solid var(--glb); background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh); display: flex; gap: 2px; cursor: pointer; font: 600 11px 'JetBrains Mono', monospace"><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button><a href="ios-documents.dc.html" aria-label="{{ L.k2 }}" class="gbtn glass" style="font: 600 17px Inter, sans-serif">?</a></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 10px"><button class="btn" disabled aria-disabled="true" style="opacity: 0.4; cursor: not-allowed">{{ L.k10 }}</button><button class="btn" style="background: var(--raised)">{{ L.k11 }}</button></div>

      <div class="icard">
        <sc-for list="{{ assets }}" as="a" hint-placeholder-count="4"><div class="irow"><span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: var(--raised); display: flex; align-items: center; justify-content: center; font: 600 11px 'JetBrains Mono', monospace">{{ a.t }}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>{{ a.n }}</span><span class="faint" style="font-size: 12px">{{ a.net }}</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span class="num">{{ a.v }}</span><span class="faint" style="font-size: 12px">{{ a.usd }}</span></span></div></sc-for>
      </div>
    </div>
    <div class="ios-fade" aria-hidden="true"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="IosTabBar" active="wallet" hint-size="390px,110px"></dc-import></div>

  <sc-if value="{{ isPrivacy }}" hint-placeholder-val="{{ false }}">

    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["update_required", "device_compromised", "offline", "privacy_cover"], "default": "offline"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>

  static EN = {"Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Кошелёк": "Wallet", "Получить": "Receive", "Отправить": "Send", "Справка": "Help", "Нет сети": "No network", "Данные на 14:20 · повтор через 12 с": "Data as of 14:20 · retry in 12 s", "Повторить": "Retry", "ОБЩИЙ БАЛАНС · НА 14:20": "TOTAL BALANCE · AS OF 14:20", "$12 480,52": "$12,480.52", "Курсы не обновляются без сети": "Rates don't update without a network", "Отправка станет доступна, когда появится сеть. Адрес для получения работает и без неё.": "Sending will be available once you're back online. The receive address works without a network.", "Содержимое скрыто": "Content hidden", "Версия 1.3.2 больше не поддерживается": "Version 1.3.2 is no longer supported", "Обновите AEON": "Update AEON", "В этой версии нет последних исправлений безопасности, поэтому переводы и P2P в ней отключены. Обновление займёт около минуты, ключи и настройки сохранятся.": "This version lacks the latest security fixes, so transfers and P2P are disabled in it. The update takes about a minute; your keys and settings will be kept.", "Установлено": "Installed", "Нужна версия": "Required version", "1.4.0 или новее": "1.4.0 or later", "Размер": "Size", "38 МБ": "38 MB", "Открыть App Store": "Open App Store", "Только посмотреть балансы": "Just view balances", "Проверка устройства": "Device check", "Устройство изменено": "Device modified", "Мы нашли признаки джейлбрейка. На таком iPhone другие приложения могут читать память AEON, поэтому переводы, выпуск из эскроу и показ фразы восстановления отключены.": "We found signs of a jailbreak. On such an iPhone other apps can read AEON's memory, so transfers, escrow release and showing the recovery phrase are disabled.", "Переводы": "Transfers", "отключены": "disabled", "P2P-сделки": "P2P deals", "только просмотр": "view only", "Балансы и история": "Balances and history", "доступны": "available", "Продолжить в режиме просмотра": "Continue in view-only mode", "Как вернуть защиту": "How to restore protection", "8 240,00": "8,240.00", "$8 240,00": "$8,240.00", "1,1840": "1.1840", "$3 112,40": "$3,112.40", "0,0142": "0.0142", "$964,12": "$964.12", "1,0500": "1.0500", "$164,00": "$164.00"};

    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');

    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const state = this.props.state ?? 'offline';
    const B = {
      up: ['000010000', '000111000', '001111100', '011010110', '110010011', '000010000', '000010000', '000010000', '111111111'],

        const n = (x * 7 + y * 13) % 11;

      return { cells };
    };
    const r = (k, v, c) => ({ k, v, c });
    const S = {

      device_compromised: { b: 'shield', accent: 'var(--neg)', lbl: this.tr('Проверка устройства'), lc: 'var(--neg)', title: this.tr('Устройство изменено'), text: this.tr('Мы нашли признаки джейлбрейка. На таком iPhone другие приложения могут читать память AEON, поэтому переводы, выпуск из эскроу и показ фразы восстановления отключены.'), rows: [r(this.tr('Переводы'), this.tr('отключены'), 'var(--neg)'), r(this.tr('P2P-сделки'), this.tr('только просмотр'), 'var(--warn)'), r(this.tr('Балансы и история'), this.tr('доступны'), 'var(--sig)')], primary: this.tr('Продолжить в режиме просмотра'), secondary: this.tr('Как вернуть защиту'), href2: '#' }
    };
    const s = S[state] || S.update_required;
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      isGate: state === 'update_required' || state === 'device_compromised',
      isOffline: state === 'offline', isPrivacy: state === 'privacy_cover',
      s, g: glyph(B[s.b], s.accent),
      logo: ['var(--sig)', 'var(--t1)', 'var(--t1)', 'var(--t1)', 'transparent', 'var(--t1)', 'var(--t1)', 'var(--t1)', 'var(--t1)'],

        { t: 'BTC', n: 'Bitcoin', net: 'Testnet', v: this.tr('0,0142'), usd: this.tr('$964,12') },
        { t: 'SOL', n: 'Solana', net: 'Devnet', v: this.tr('1,0500'), usd: this.tr('$164,00') }

  }
}
</script>
