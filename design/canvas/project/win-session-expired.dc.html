<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AEON для Windows — сессия завершена</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="{{ themeClass }} " style="position: relative; width: 1440px; height: 900px; overflow: hidden">
  <dc-import name="win-wallet-home" theme="{{ theme }}" lang="{{ lang }}" hint-size="1440px,900px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 48px 0 0 0; background: var(--scrim)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="wse-t" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; border-radius: 8px; border: 1px solid var(--bd); background: var(--flyout); box-shadow: 0 32px 64px rgba(0,0,0,.37); overflow: hidden; font-size: 13px">
    <div style="padding: 24px 24px 20px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="wse-t" style="margin: 0; font: 600 20px Inter, sans-serif">{{ L.k1 }}</h2>
      <span class="muted" style="line-height: 19px">{{ L.k2 }}</span>
      <button class="wbtn wbtn-p" style="height: 40px; margin-top: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9v1.5M15 9v1.5M12 9v4h-1M9 15.5c1.8 1.4 4.2 1.4 6 0"></path></svg>{{ L.k3 }}</button>
      <div style="display: flex; align-items: center; gap: 10px" class="faint"><span style="flex: 1; height: 1px; background: var(--bs)"></span>{{ L.k4 }}<span style="flex: 1; height: 1px; background: var(--bs)"></span></div>
      <label style="display: flex; flex-direction: column; gap: 4px"><span class="muted">{{ L.k5 }}</span><span class="winp" style="height: 36px; border-bottom: 2px solid var(--sigt)"><input type="password" defaultValue="aeon-test-2026"></span></label>
    </div>
    <div style="padding: 20px 24px; background: var(--dfoot); border-top: 1px solid var(--bs); display: flex; gap: 8px"><button class="wbtn" style="flex: 1">{{ L.k6 }}</button><a href="win-wallet-home.dc.html" class="wbtn wbtn-p" style="flex: 1">{{ L.k7 }}</a></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  static EN = {"Сессия завершена": "Session ended", "AEON был неактивен 30 минут. Войдите снова — открытые окна сделок и введённые данные сохранятся.": "AEON was inactive for 30 minutes. Sign in again — open deal windows and what you entered will be kept.", "Войти через Windows Hello": "Sign in with Windows Hello", "или паролем": "or with password", "Пароль для alex.t@mail.test": "Password for alex.t@mail.test", "Выйти из аккаунта": "Sign out", "Войти · Enter": "Sign in · Enter"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Сессия завершена"), k2: this.tr("AEON был неактивен 30 минут. Войдите снова — открытые окна сделок и введённые данные сохранятся."), k3: this.tr("Войти через Windows Hello"), k4: this.tr("или паролем"), k5: this.tr("Пароль для alex.t@mail.test"), k6: this.tr("Выйти из аккаунта"), k7: this.tr("Войти · Enter") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      theme
    };
  }
}
</script>
</body>
</html>
