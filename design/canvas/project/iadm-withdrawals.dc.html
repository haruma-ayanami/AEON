<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS Admin — выводы на проверке</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="mob {{ themeClass }} phone">
  <div class="ios-body" style="top: 116px">
    <div role="tablist" class="glass" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 999px"><button role="tab" aria-selected="true" class="btn btn-p" style="height: 36px; font-size: 14px">{{ tabQ }}</button><button role="tab" aria-selected="false" class="btn" style="height: 36px; font-size: 14px; background: transparent">{{ L.k2 }}</button><button role="tab" aria-selected="false" class="btn" style="height: 36px; font-size: 14px; background: transparent">{{ L.k3 }}</button></div>
<sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 12px">    <span class="hint" style="padding: 0 4px">{{ L.k4 }}</span>
    <div class="icard"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="6"><a href="{{ r.href }}" class="irow" style="min-height: 72px"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; gap: 8px; align-items: baseline"><span style="font-weight: 600">{{ r.amt }}</span><span class="faint" style="font-size: 12px">{{ r.user }} · {{ r.net }}</span></span><span class="muted" style="font-size: 12px">{{ r.reason }}</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span class="mono" style="font-size: 13px; font-weight: 600; color: {{ r.rc }}">{{ r.risk }}</span><span class="mono faint" style="font-size: 11px; color: {{ r.ac }}">{{ r.age }}</span></span></a></sc-for></div></div></sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding: 40px 18px 30px; border-radius: 22px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><span aria-hidden="true" class="dots" style="width: 72px; height: 72px; border-radius: 22px; border: 1px dashed var(--bst); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M8 12l3 3 5-6"></path></svg></span><span style="font-weight: 600; font-size: 17px">{{ L.k30 }}</span><span style="font-size: 14px; line-height: 20px; color: var(--t2); max-width: 420px">{{ L.k31 }}</span><div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px"><span class="chip c-ok">{{ L.k32 }}</span><span class="chip c-neg">{{ L.k33 }}</span><span class="chip c-off">{{ L.k34 }}</span></div></div></sc-if>

  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(180deg, var(--fade) 70%, transparent)"></div>
  <div class="ios-nav" style="align-items: flex-start"><span style="flex: 1; min-width: 0; padding-top: 2px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span class="disp" style="max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 30px; line-height: 36px">{{ L.k5 }}</span><span style="display: flex; align-items: center; gap: 6px"><span class="testnet" style="height: 18px; padding: 0 7px">TESTNET</span><span style="height: 18px; padding: 0 7px; box-sizing: border-box; border-radius: 999px; border: 1px solid var(--bd); font: 500 10px 'JetBrains Mono', monospace; letter-spacing: .06em; color: var(--t2); display: inline-flex; align-items: center">ADMIN</span></span></span><button onClick="{{ toggleLang }}" aria-label="{{ L.k6 }}" style="height: 44px; padding: 4px; flex: none; box-sizing: border-box; border-radius: 999px; border: 0.5px solid var(--glb); background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh); display: flex; gap: 2px; cursor: pointer; font: 600 11px 'JetBrains Mono', monospace"><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button><button aria-label="{{ L.kh }}" class="gbtn glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg></button></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(180deg, transparent, var(--fade))"></div><nav aria-label="{{ L.k7 }}" class="glass" style="position: absolute; left: 16px; right: 16px; bottom: 30px; height: 62px; border-radius: 999px; padding: 5px; box-sizing: border-box; display: flex; gap: 4px"><a href="iadm-alerts.dc.html" style="position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); background: transparent; font: 500 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>{{ L.k8 }}<span style="position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">3</span></a><a href="iadm-withdrawals.dc.html" aria-current="page" style="position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--pfg); background: var(--pbg); font: 600 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>{{ L.k5 }}<sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">6</span></sc-if></a><a href="iadm-disputes.dc.html" style="position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); background: transparent; font: 500 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>{{ L.k9 }}<span style="position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">4</span></a><button type="button" style="border: 0; background: transparent; font: inherit; color: inherit; text-align: inherit; cursor: pointer; padding: 0; position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); background: transparent; font: 500 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>{{ L.k10 }}</button></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  static EN = {"Подсказка по разделу": "Section help", "Очередь · 6": "Queue · 6", "Мои · 1": "Mine · 1", "Решённые": "Resolved", "Сортировка: дольше всех ждут. Норматив — 2 часа.": "Sorted by waiting time. Target — 2 hours.", "Выводы": "Withdrawals", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Разделы админки": "Admin sections", "Алерты": "Alerts", "Споры": "Disputes", "Ещё": "More", "риск ": "risk ", "4 000 USDT": "4,000 USDT", "Высокий риск адреса": "High-risk address", "1 ч 42 мин": "1 h 42 min", "2,5 ETH": "2.5 ETH", "Выше порога 5 000 $": "Above the $5,000 threshold", "58 мин": "58 min", "0,0012 BTC": "0.0012 BTC", "Новый адрес вывода": "New withdrawal address", "41 мин": "41 min", "1 200 USDT": "1,200 USDT", "Ошибка скоринга, повтор": "Scoring error, retrying", "22 мин": "22 min", "0,8 BTC": "0.8 BTC", "Новое устройство + сумма": "New device + amount", "15 мин": "15 min", "Выше суточного лимита": "Above the daily limit", "4 мин": "4 min", "Очередь": "Queue", "Очередь пуста": "Queue is empty", "Все выводы проверены. Пришлём пуш, когда появится заявка выше порога или с высоким риском.": "All withdrawals are reviewed. We'll send a push when a request above the threshold or with high risk arrives.", "Одобрено сегодня · 18": "Approved today · 18", "Отклонено · 2": "Rejected · 2", "Среднее время · 24 мин": "Average time · 24 min"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Очередь · 6"), k2: this.tr("Мои · 1"), k3: this.tr("Решённые"), k4: this.tr("Сортировка: дольше всех ждут. Норматив — 2 часа."), k5: this.tr("Выводы"), k6: this.tr("Язык интерфейса: русский. Переключить на английский"), k7: this.tr("Разделы админки"), k8: this.tr("Алерты"), k9: this.tr("Споры"), k10: this.tr("Ещё"), k11: this.tr("риск "), k12: this.tr("4 000 USDT"), k13: this.tr("Высокий риск адреса"), k14: this.tr("1 ч 42 мин"), k15: this.tr("2,5 ETH"), k16: this.tr("Выше порога 5 000 $"), k17: this.tr("58 мин"), k18: this.tr("0,0012 BTC"), k19: this.tr("Новый адрес вывода"), k20: this.tr("41 мин"), k21: this.tr("1 200 USDT"), k22: this.tr("Ошибка скоринга, повтор"), k23: this.tr("22 мин"), k24: this.tr("0,8 BTC"), k25: this.tr("Новое устройство + сумма"), k26: this.tr("15 мин"), k27: this.tr("Выше суточного лимита"), k28: this.tr("4 мин"), k29: this.tr("Очередь"), k30: this.tr("Очередь пуста"), k31: this.tr("Все выводы проверены. Пришлём пуш, когда появится заявка выше порога или с высоким риском."), k32: this.tr("Одобрено сегодня · 18"), k33: this.tr("Отклонено · 2"), k34: this.tr("Среднее время · 24 мин"), kh: this.tr("Подсказка по разделу") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    const rc = (r) => (r >= 85 ? 'var(--neg)' : r >= 60 ? 'var(--orange, #FF9A5B)' : r >= 25 ? 'var(--warn)' : 'var(--sigt)');
    const w = (amt, user, net, reason, risk, age, first) => ({ amt, user, net, reason, risk: this.tr("риск ") + risk, rc: rc(risk), age, ac: first ? 'var(--warn)' : 'var(--t3)', href: first ? 'iadm-withdrawal.dc.html' : '#' });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark', tabQ: st === 'empty' ? this.tr("Очередь") : this.tr("Очередь · 6"), isDefault: st === 'default', isEmpty: st === 'empty',
      rows: [w(this.tr("4 000 USDT"), 'p2p_ivan', 'Sepolia', this.tr("Высокий риск адреса"), 82, this.tr("1 ч 42 мин"), true), w(this.tr("2,5 ETH"), 'trade_room', 'Sepolia', this.tr("Выше порога 5 000 $"), 18, this.tr("58 мин")), w(this.tr("0,0012 BTC"), 'alex_tk', 'Testnet', this.tr("Новый адрес вывода"), 31, this.tr("41 мин")), w(this.tr("1 200 USDT"), 'mbtc', 'Sepolia', this.tr("Ошибка скоринга, повтор"), 47, this.tr("22 мин")), w(this.tr("0,8 BTC"), 'gold_x', 'Testnet', this.tr("Новое устройство + сумма"), 64, this.tr("15 мин")), w('150 SOL', 'eva_s', 'Devnet', this.tr("Выше суточного лимита"), 9, this.tr("4 мин"))]
    };
  }
}
</script>
</body>
</html>
