<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прототип · Сценарий 15 · Покупка через P2P (Android)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="th-dark" style="width: 412px; height: 987px; overflow: hidden; background: var(--sunken)">
  <div style="height: 72px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--bs); background: var(--surface)">
    <button onClick="{{ back }}" disabled="{{ atFirst }}" aria-label="{{ t.back }}" class="ibtn" style="opacity: {{ backOp }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span class="lbl" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.scn }}</span>
      <span aria-live="polite" style="font: 600 14px Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.step }}</span>
      <div style="display: flex; gap: 3px">
        <sc-for list="{{ segs }}" as="g" hint-placeholder-count="5"><button onClick="{{ g.go }}" aria-label="{{ g.label }}" aria-current="{{ g.cur }}" style="flex: 1; height: 10px; padding: 3px 0; border: 0; background: transparent; cursor: pointer; box-sizing: border-box"><span style="display: block; height: 4px; border-radius: 2px; background: {{ g.bg }}"></span></button></sc-for>
      </div>
    </div>
    <button onClick="{{ restart }}" aria-label="{{ t.restart }}" class="ibtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"></path></svg></button>
  </div>
  <div style="position: relative; height: 915px; display: flex; justify-content: center; align-items: flex-start">
    <sc-if value="{{ on1 }}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; width: 412px; height: 915px; overflow: hidden">
  <dc-import name="and-wallet-home" lang="{{ lang }}" hint-size="412px,915px"></dc-import>
  <button onClick="{{ go2 }}" aria-label="{{ s1.pr_and_1_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 264px; top: 242px; width: 116px; height: 56px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>
</div>
    </sc-if>
    <sc-if value="{{ on2 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 412px; height: 915px; overflow: hidden">
  <dc-import name="and-p2p-market" lang="{{ lang }}" hint-size="412px,915px"></dc-import>
  <button onClick="{{ go3 }}" aria-label="{{ s2.pr_and_2_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 286px; top: 270px; width: 98px; height: 48px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>
</div>
    </sc-if>
    <sc-if value="{{ on3 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 412px; height: 915px; overflow: hidden">
  <dc-import name="and-p2p-deal" lang="{{ lang }}" hint-size="412px,915px"></dc-import>
  <button onClick="{{ go4 }}" aria-label="{{ s3.pr_and_3_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 137px; top: 831px; width: 263px; height: 60px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>
  <div class="th-dark" style="position: absolute; left: 12px; right: 12px; top: 56px; background: transparent">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--raised); border: 1px solid var(--bd); box-shadow: 0 16px 48px rgba(0,0,0,0.45); color: var(--t1)">
      <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--surface); color: var(--sig); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 14px Inter, sans-serif">{{ s3.ttitle }}</span><span style="font-size: 13px; line-height: 18px; color: var(--t2)">{{ s3.ttext }}</span></span>
    </div>
  </div>
</div>
    </sc-if>
    <sc-if value="{{ on4 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 412px; height: 915px; overflow: hidden">
  <dc-import name="and-p2p-deal" status="paid" lang="{{ lang }}" hint-size="412px,915px"></dc-import>
  <button onClick="{{ go5 }}" aria-label="{{ s4.pr_and_4_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 30px; top: 228px; width: 352px; height: 104px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>
</div>
    </sc-if>
    <sc-if value="{{ on5 }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 412px; height: 915px; overflow: hidden">
  <dc-import name="and-p2p-deal" status="done" lang="{{ lang }}" hint-size="412px,915px"></dc-import>
  <button onClick="{{ go1 }}" aria-label="{{ s5.pr_and_5_z0 }}" style="border: 0; padding: 0; cursor: pointer; position: absolute; left: 12px; top: 831px; width: 129px; height: 60px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(182,243,107,0.75), 0 0 0 6px rgba(182,243,107,0.18); background: rgba(182,243,107,0.06)"></button>
  <div class="th-dark" style="position: absolute; left: 12px; right: 12px; top: 56px; background: transparent">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--raised); border: 1px solid var(--bd); box-shadow: 0 16px 48px rgba(0,0,0,0.45); color: var(--t1)">
      <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--surface); color: var(--sig); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 14px Inter, sans-serif">{{ s5.ttitle }}</span><span style="font-size: 13px; line-height: 18px; color: var(--t2)">{{ s5.ttext }}</span></span>
    </div>
  </div>
</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 412, "height": 987}}'>
// Кликабельный сценарий 15: шаги — окна в исходные экраны, подсвеченные зоны переключают шаг. Экраны правьте в оригиналах.
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? "ru";
    const en = lang === 'en';
    const n = 5;
    const step = Math.min(Math.max((this.state && this.state.step) || 1, 1), n);
    const go = (k) => () => this.setState({ step: k });
    const names = ["кошелёк", "выбор продавца", "оплата по реквизитам", "ждём продавца", "сделка завершена"];
    const namesEn = ["wallet", "choosing a seller", "paying by details", "waiting for the seller", "deal completed"];
    const v = { lang };
    for (let k = 1; k <= n; k++) { v['on' + k] = step === k; v['go' + k] = go(k); }
    v.back = go(Math.max(step - 1, 1));
    v.restart = go(1);
    v.atFirst = step === 1;
    v.backOp = step === 1 ? '0.4' : '1';
    v.t = {
      scn: en ? "Scenario 15 · Buy via P2P (Android)" : "Сценарий 15 · Покупка через P2P (Android)",
      step: (en ? 'Step ' + step + ' of ' + n + ' · ' + namesEn[step - 1] : 'Шаг ' + step + ' из ' + n + ' · ' + names[step - 1]),
      back: en ? 'Previous step' : 'Предыдущий шаг',
      restart: en ? 'Start over' : 'Начать сначала'
    };
    v.segs = names.map((nm, i) => ({ go: go(i + 1), label: (en ? 'Step ' + (i + 1) + ': ' + namesEn[i] : 'Шаг ' + (i + 1) + ': ' + nm), cur: i + 1 === step ? 'step' : 'false', bg: i + 1 <= step ? 'var(--sigt)' : 'var(--bd)' }));
    v.s1 = { pr_and_1_z0: en ? "Open P2P" : "Открыть P2P" };
    v.s2 = { pr_and_2_z0: en ? "Buy from crypto_mila" : "Купить у crypto_mila" };
    v.s3 = { pr_and_3_z0: en ? "I paid 23,100 ₽" : "Я оплатил 23 100 ₽", ttitle: en ? "Deal P2P-48213 opened" : "Сделка P2P-48213 открыта", ttext: en ? "The seller's 250 USDT are locked in escrow for 15 minutes." : "250 USDT продавца заблокированы в эскроу на 15 минут." };
    v.s4 = { pr_and_4_z0: en ? "Seller confirmed the payment" : "Продавец подтвердил поступление" };
    v.s5 = { pr_and_5_z0: en ? "To wallet" : "В кошелёк", ttitle: en ? "Seller released 250 USDT" : "Продавец выпустил 250 USDT", ttext: en ? "Coins are in your wallet. Rate the deal to help other buyers." : "Монеты зачислены на кошелёк. Оцените сделку — это поможет другим покупателям." };
    return v;
  }
}
</script>
</body>
</html>
