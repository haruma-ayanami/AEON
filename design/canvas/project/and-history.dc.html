<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "loading", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 412, "height": 915}}'>

  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Назад"), k2: this.tr("История"), k3: this.tr("Поиск по хешу или адресу"), k4: this.tr("Язык интерфейса: русский. Переключить на английский"), k5: this.tr("СЕГОДНЯ"), k6: this.tr("ВЧЕРА"), k7: this.tr("Все"), k8: this.tr("Входящие"), k9: this.tr("Исходящие"), k10: this.tr("Получено ETH"), k11: this.tr("Подтверждается 3/12"), k12: this.tr("+0,05 ETH"), k13: this.tr("Эскроу P2P-48213"), k14: this.tr("В эскроу"), k15: this.tr("Вывод BTC"), k16: this.tr("На ручной проверке"), k17: this.tr("−0,0012 BTC"), k18: this.tr("Отправлено USDT"), k19: this.tr("Выполнен"), k20: this.tr("−250,00"), k21: this.tr("P2P-продажа"), k22: this.tr("Завершена"), k23: this.tr("Получено USDT"), k24: this.tr("Зачислен"), k25: this.tr("+500,00"), k26: this.tr("Загружаем историю"), k27: this.tr("Операций пока нет"), k28: this.tr("Здесь появятся зачисления, переводы и сделки P2P — с поиском по хешу и адресу."), k29: this.tr("Получить первые монеты") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    const R = 'M17 7L7 17M7 9v8h8', S = 'M7 17L17 7M9 7h8v8', E = 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3';
    const x = (t, s, sc, a, ac, time, d) => ({ t, s, sc, a, ac, time, d });
    const chip = (l, on) => ({ l, bd: on ? 'transparent' : 'var(--bst)', bg: on ? 'var(--sigs)' : 'transparent', fg: on ? 'var(--sigt)' : 'var(--t1)' });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark', isDefault: st === 'default', isLoading: st === 'loading', isEmpty: st === 'empty',
      chips: [chip(this.tr("Все"), true), chip(this.tr("Входящие")), chip(this.tr("Исходящие")), chip('P2P')],
      today: [x(this.tr("Получено ETH"), this.tr("Подтверждается 3/12"), 'var(--info)', this.tr("+0,05 ETH"), 'var(--sigt)', '12:41', R), x(this.tr("Эскроу P2P-48213"), this.tr("В эскроу"), 'var(--info)', '250 USDT', 'var(--t1)', '10:10', E), x(this.tr("Вывод BTC"), this.tr("На ручной проверке"), 'var(--warn)', this.tr("−0,0012 BTC"), 'var(--t1)', '09:30', S)],
      yday: [x(this.tr("Отправлено USDT"), this.tr("Выполнен"), 'var(--sigt)', this.tr("−250,00"), 'var(--t1)', '18:02', S), x(this.tr("P2P-продажа"), this.tr("Завершена"), 'var(--sigt)', '−100 USDT', 'var(--t1)', '15:40', 'M4 8h13l-3-3M20 16H7l3 3'), x(this.tr("Получено USDT"), this.tr("Зачислен"), 'var(--sigt)', this.tr("+500,00"), 'var(--sigt)', '14:20', R)]
    };
  }
}
</script>
