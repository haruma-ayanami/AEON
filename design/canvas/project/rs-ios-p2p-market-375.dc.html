<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS 375×667 · P2P · маркетплейс</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ipc" style="width: 375px; height: 667px; overflow: hidden">
  <dc-import name="ios-p2p-market" theme="{{ theme }}" lang="{{ lang }}" hint-size="375px,667px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 375, "height": 667}}'>
// Адаптив: окно в ios-p2p-market.dc.html шириной 375 px. Раскладку правьте в оригинале и в правилах .rsp/.ipc в aeon.css.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { theme: p.theme ?? "dark", lang: p.lang ?? "ru" };
  }
}
</script>
</body>
</html>
