<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Windows — навигация админки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="{{ L.k1 }}" style="width: 220px; height: 852px; box-sizing: border-box; padding: 4px 4px 8px; background: var(--mica, #151917); color: var(--t1, #F2F5F1); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 2px">
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="14">
    <sc-if value="{{ n.isGroup }}" hint-placeholder-val="{{ false }}"><span style="padding: 12px 16px 4px; font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: var(--t3, #8A938C)">{{ n.label }}</span></sc-if>
    <sc-if value="{{ n.isItem }}" hint-placeholder-val="{{ true }}">
      <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position: relative; height: 34px; margin: 0 4px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--t1, #F2F5F1); background: {{ n.bg }}; font: {{ n.font }}">
        <sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; top: 9px; width: 3px; height: 16px; border-radius: 2px; background: var(--sig, #B6F36B)"></span></sc-if>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
        <span style="flex: 1">{{ n.label }}</span>
        <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn, #F5B941); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: inline-flex; align-items: center; justify-content: center">{{ n.badge }}</span></sc-if>
      </a>
    </sc-if>
  </sc-for>
  <div style="flex: 1"></div>
  <button type="button" style="border: 0; background: transparent; font: inherit; color: inherit; text-align: inherit; cursor: pointer; padding: 0; height: 36px; margin: 0 4px 6px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--t1, #F2F5F1); font: 400 13px Inter, sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg><span>{{ L.kh }}</span></button>
  <div style="margin: 0 8px 8px; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--bs, #232824); display: flex; align-items: center; gap: 10px">
    <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: var(--bd, #2E342F); display: flex; align-items: center; justify-content: center; font: 600 10px Inter, sans-serif">{{ uIni }}</span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 500">{{ uNick }}</span><span style="font: 500 9px 'JetBrains Mono', monospace; color: var(--t3, #8A938C)">{{ uRole }}</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["overview", "users", "offers", "deals", "disputes", "withdrawals", "deposits", "risk", "audit", "system", "refs"], "default": "overview"}, "who": {"editor": "enum", "options": ["admin", "support"], "default": "admin"}, "cleared": {"editor": "enum", "options": ["none", "disputes", "withdrawals"], "default": "none"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "onLang": {"editor": null}, "$preview": {"width": 220, "height": 852}}'>
class Component extends DCLogic {
  static EN = {"Справка · F1": "Help · F1", "Разделы администрирования": "Admin sections", "ОА": "OA", "АДМИНИСТРАТОР · АРБИТР": "ADMIN · ARBITRATOR", "ЛЮДИ И РЫНОК": "PEOPLE AND MARKET", "Обзор": "Overview", "Пользователи": "Users", "Объявления": "Offers", "Сделки": "Deals", "КОНТРОЛЬ": "CONTROL", "Споры": "Disputes", "Выводы": "Withdrawals", "Депозиты": "Deposits", "Риски и AML": "Risk and AML", "СИСТЕМА": "SYSTEM", "Журнал событий": "Event log", "Узлы и сверка": "Nodes & recon", "Справочники": "Reference data", "ПОДДЕРЖКА · ПРОСМОТР": "SUPPORT · VIEW ONLY", "ДС": "DS"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Разделы администрирования"), k2: this.tr("ОА"), k3: this.tr("АДМИНИСТРАТОР · АРБИТР"), k4: this.tr("ПОДДЕРЖКА · ПРОСМОТР"), k5: this.tr("ДС"), kh: this.tr("Справка · F1") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const cleared = this.props.cleared ?? 'none';
    const active = this.props.active ?? 'overview';
    const g = (label) => ({ isGroup: true, isItem: false, label });
    const it = (key, label, href, d, badge) => {
      if (key === cleared) badge = '';
      const on = key === active;
      return { isGroup: false, isItem: true, label, href, d, on, badge: badge || '', hasBadge: !!badge, current: on ? 'page' : 'false', bg: on ? 'var(--wsel, rgba(255,255,255,0.06))' : 'transparent', font: on ? '600 13px Inter, sans-serif' : '400 13px Inter, sans-serif' };
    };
    const sup = (this.props.who ?? 'admin') === 'support';
    return {
      uIni: sup ? this.tr('ДС') : this.tr('ОА'), uNick: sup ? 'sup_dmitry' : 'arb_olga', uRole: sup ? this.tr('ПОДДЕРЖКА · ПРОСМОТР') : this.tr('АДМИНИСТРАТОР · АРБИТР'),
      items: [
        g(this.tr('ЛЮДИ И РЫНОК')),
        it('overview', this.tr('Обзор'), 'wadm-overview.dc.html', 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z'),
        it('users', this.tr('Пользователи'), 'wadm-users.dc.html', 'M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5'),
        it('offers', this.tr('Объявления'), 'wadm-offers.dc.html', 'M4 5h16v14H4zM8 9h8M8 13h5', '5'),
        it('deals', this.tr('Сделки'), 'wadm-deals.dc.html', 'M4 8h13l-3-3M20 16H7l3 3'),
        g(this.tr('КОНТРОЛЬ')),
        it('disputes', this.tr('Споры'), 'wadm-disputes.dc.html', 'M5 21V4M5 4h11l-2 4 2 4H5', '4'),
        it('withdrawals', this.tr('Выводы'), 'wadm-withdrawals.dc.html', 'M7 17L17 7M9 7h8v8', '6'),
        it('deposits', this.tr('Депозиты'), 'wadm-deposits.dc.html', 'M17 7L7 17M7 9v8h8', '2'),
        it('risk', this.tr('Риски и AML'), 'wadm-risk.dc.html', 'M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6z'),
        g(this.tr('СИСТЕМА')),
        it('audit', this.tr('Журнал событий'), 'wadm-audit.dc.html', 'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h5'),
        it('system', this.tr('Узлы и сверка'), 'wadm-system.dc.html', 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9'),
        it('refs', this.tr('Справочники'), 'wadm-refs.dc.html', 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6')
      ]
    };
  }
}
</script>
</body>
</html>
