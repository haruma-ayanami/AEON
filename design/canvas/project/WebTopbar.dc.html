<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Веб — шапка раздела</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header class="wt" style="position: relative; min-height: 88px; box-sizing: border-box; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--canvas, #0A0C0B); border-bottom: 1px solid var(--bs, #232824); color: var(--t1, #F2F5F1); font-family: Inter, system-ui, sans-serif">
  <h1 style="margin: 0; font: 600 28px 'Inter Tight', sans-serif; letter-spacing: -0.02em">{{ heading }}</h1>
  <button aria-label="{{ L.k1 }}" style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--bd, #2E342F); background: transparent; color: var(--t2, #A3ACA5); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg></button>
  <span style="flex: 1 1 24px"></span>
  <label class="wt-search" style="flex: 0 1 360px; min-width: 200px; height: 44px; padding: 0 8px 0 14px; box-sizing: border-box; border-radius: 999px; background: var(--raised, #1B1F1C); display: flex; align-items: center; gap: 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t2, #A3ACA5)" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M16 16l4 4"></path></svg>
    <input aria-label="{{ L.k2 }}" placeholder="{{ L.k3 }}" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--t1, #F2F5F1); font: 400 14px Inter, sans-serif; outline: none">
    <span style="font: 500 11px 'JetBrains Mono', monospace; color: var(--t3, #8A938C); border: 1px solid var(--bd, #2E342F); border-radius: 6px; padding: 2px 6px">Ctrl K</span>
  </label>
  <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: var(--tnb, #2A230F); color: var(--tnf, #F5B941); font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 1px; background: var(--tnf, #F5B941)"></span>{{ L.k4 }}</span>
  <button aria-label="{{ L.k5 }}" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--raised, #1B1F1C); color: var(--t1, #F2F5F1); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg><span aria-hidden="true" style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 2px; background: var(--sig, #B6F36B)"></span></button>
  <button onClick="{{ toggleLang }}" aria-label="{{ L.k6 }}" style="height: 44px; padding: 4px; box-sizing: border-box; border-radius: 999px; border: 0; background: var(--raised, #1B1F1C); display: inline-flex; gap: 2px; cursor: pointer; font: 500 12px 'JetBrains Mono', monospace"><span style="min-width: 38px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 38px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button>
  <sc-if value="{{ notifOpen }}" hint-placeholder-val="{{ false }}">
    <section role="dialog" aria-label="{{ L.k8 }}" style="position: absolute; right: 96px; top: 74px; z-index: 30; width: 400px; border-radius: 20px; background: var(--surface, #131614); border: 1px solid var(--bd, #2E342F); box-shadow: 0 24px 64px rgba(0,0,0,.5); overflow: hidden">
      <div style="display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--bs, #232824)"><span style="flex: 1; font: 600 16px Inter, sans-serif">{{ L.k8 }} <span style="font: 500 12px 'JetBrains Mono', monospace; color: var(--t3, #8A938C)">· {{ L.k9 }}</span></span><button style="border: 0; background: transparent; color: var(--t2, #A3ACA5); font: 500 13px Inter, sans-serif; cursor: pointer">{{ L.k10 }}</button></div>
      <sc-for list="{{ nItems }}" as="n" hint-placeholder-count="4"><a href="{{ n.href }}" style="display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--bs, #232824); text-decoration: none; color: var(--t1, #F2F5F1); background: {{ n.bg }}"><span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: {{ n.ib }}; color: {{ n.ic }}; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font: {{ n.w }} 14px Inter, sans-serif">{{ n.t }}</span><span style="font: 400 11px 'JetBrains Mono', monospace; color: var(--t3, #8A938C)">{{ n.time }}</span></span><span style="font-size: 12px; line-height: 17px; color: var(--t2, #A3ACA5)">{{ n.s }}</span></span></a></sc-for>
      <a href="web-notifications.dc.html" style="display: flex; justify-content: center; padding: 12px; font: 600 13px Inter, sans-serif; color: var(--t1, #F2F5F1); text-decoration: none">{{ L.k11 }}</a>
    </section>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading": {"editor": "text", "default": "Кошелёк"}, "notif": {"editor": "enum", "options": ["closed", "open"], "default": "closed"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "onLang": {"editor": null}, "$preview": {"width": 1200, "height": 88}}'>
class Component extends DCLogic {
  static EN = {"Кошелёк": "Wallet", "ТЕСТОВАЯ СЕТЬ": "TESTNET", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Подсказка по разделу": "Section help", "Поиск": "Search", "Актив, сделка или хеш": "Asset, deal or hash", "Уведомления, 3 новых": "Notifications, 3 new", "Уведомления": "Notifications", "3 новых": "3 new", "Прочитать все": "Mark all read", "Все уведомления и настройки": "All notifications and settings", "Продавец ждёт оплату": "The seller is waiting for payment", "P2P-48213 · осталось 04:12": "P2P-48213 · 04:12 left", "2 мин": "2 min", "Депозит обнаружен": "Deposit detected", "+0,05 ETH · подтверждения 3 из 12": "+0.05 ETH · confirmations 3 of 12", "4 мин": "4 min", "Вход с нового устройства": "Sign-in from a new device", "Windows 11 · Москва · 12:02": "Windows 11 · Moscow · 12:02", "42 мин": "42 min", "Вывод на ручной проверке": "Withdrawal under manual review", "0,0012 BTC · решение до 11:30": "0.0012 BTC · decision by 11:30", "3 ч": "3 h"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Подсказка по разделу"), k2: this.tr("Поиск"), k3: this.tr("Актив, сделка или хеш"), k4: this.tr("ТЕСТОВАЯ СЕТЬ"), k5: this.tr("Уведомления, 3 новых"), k6: this.tr("Язык интерфейса: русский. Переключить на английский"), k7: this.tr("Кошелёк"), k8: this.tr("Уведомления"), k9: this.tr("3 новых"), k10: this.tr("Прочитать все"), k11: this.tr("Все уведомления и настройки"), k12: this.tr("Продавец ждёт оплату"), k13: this.tr("P2P-48213 · осталось 04:12"), k14: this.tr("2 мин"), k15: this.tr("Депозит обнаружен"), k16: this.tr("+0,05 ETH · подтверждения 3 из 12"), k17: this.tr("4 мин"), k18: this.tr("Вход с нового устройства"), k19: this.tr("Windows 11 · Москва · 12:02"), k20: this.tr("42 мин"), k21: this.tr("Вывод на ручной проверке"), k22: this.tr("0,0012 BTC · решение до 11:30"), k23: this.tr("3 ч") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const P = 'M4 8h13l-3-3M20 16H7l3 3', R = 'M17 7L7 17M7 9v8h8', S = 'M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6z', W = 'M7 17L17 7M9 7h8v8';
    const it = (t, s, time, d, ib, ic, unread, href) => ({ t, s, time, d, ib, ic, href: href || '#', w: unread ? 600 : 500, bg: unread ? 'var(--sel, rgba(182,243,107,.06))' : 'transparent' });
    const open = this.props.notif === true || this.props.notif === 'true' || this.props.notif === 'open';
    return { heading: this.props.heading ?? this.tr('Кошелёк'), notifOpen: open,
      nItems: open ? [it(this.tr('Продавец ждёт оплату'), this.tr('P2P-48213 · осталось 04:12'), this.tr('2 мин'), P, 'var(--warns, rgba(245,185,65,.12))', 'var(--warn, #F5B941)', true, 'web-p2p-deal.dc.html'), it(this.tr('Депозит обнаружен'), this.tr('+0,05 ETH · подтверждения 3 из 12'), this.tr('4 мин'), R, 'var(--infos, rgba(110,162,255,.12))', 'var(--info, #6EA2FF)', true, 'web-history.dc.html'), it(this.tr('Вход с нового устройства'), this.tr('Windows 11 · Москва · 12:02'), this.tr('42 мин'), S, 'var(--negs, rgba(255,122,107,.12))', 'var(--neg, #FF7A6B)', true, 'web-security.dc.html'), it(this.tr('Вывод на ручной проверке'), this.tr('0,0012 BTC · решение до 11:30'), this.tr('3 ч'), W, 'var(--raised, #1B1F1C)', 'var(--t2, #A3ACA5)', false)] : [] };
  }
}
</script>
</body>
</html>
