<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS — таб-бар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 110px; position: relative; font-family: Inter, system-ui, sans-serif; color: var(--t1, #F2F5F1)">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent, var(--fade, rgba(10,12,11,0.75)))"></div>
  <nav aria-label="{{ L.k1 }}" style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 8px; align-items: center">
    <div style="flex: 1; height: 60px; border-radius: 999px; border: 0.5px solid var(--glb, rgba(255,255,255,0.18)); background: var(--glass, rgba(28,32,29,0.42)); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh, rgba(255,255,255,0.28)), 0 8px 32px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; box-sizing: border-box">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
        <sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><a href="{{ n.href }}" aria-current="page" style="height: 48px; padding: 0 14px; border-radius: 999px; background: var(--pbg, #F2F5F1); color: var(--pfg, #0A0C0B); display: flex; align-items: center; gap: 6px; text-decoration: none; font: 600 13px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>{{ n.label }}</a></sc-if>
        <sc-if value="{{ n.off }}" hint-placeholder-val="{{ true }}"><a href="{{ n.href }}" aria-label="{{ n.aria }}" style="position: relative; width: 44px; height: 48px; color: var(--t1, #F2F5F1); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg><sc-if value="{{ n.dot }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 12px; right: 9px; width: 8px; height: 8px; border-radius: 2px; background: var(--sig, #B6F36B)"></span></sc-if></a></sc-if>
      </sc-for>
    </div>
    <button aria-label="{{ L.k2 }}" style="width: 56px; height: 56px; flex: none; border-radius: 999px; border: 0.5px solid var(--glb, rgba(255,255,255,0.18)); background: var(--glass, rgba(28,32,29,0.42)); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh, rgba(255,255,255,0.28)), 0 8px 32px rgba(0,0,0,0.35); color: var(--t1, #F2F5F1); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M16 16l4 4"></path></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["wallet", "p2p", "analytics", "notifications", "profile"], "default": "wallet"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "onLang": {"editor": null}, "$preview": {"width": 390, "height": 110}}'>
class Component extends DCLogic {
  static EN = {"Кошелёк": "Wallet", "Аналитика": "Analytics", "Профиль": "Profile", "Уведомления": "Notifications", "Поиск": "Search", "Основные разделы": "Main sections", ", есть новые": ", new items"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Основные разделы"), k2: this.tr("Поиск"), k3: this.tr("Кошелёк"), k4: this.tr("Аналитика"), k5: this.tr("Уведомления"), k6: this.tr("Профиль"), k7: this.tr(", есть новые") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const active = this.props.active ?? 'wallet';
    const items = [
      { key: 'wallet', label: this.tr('Кошелёк'), href: 'ios-wallet-home.dc.html', d: 'M3 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zM3 9h15M16 12.5h2' },
      { key: 'p2p', label: 'P2P', href: 'ios-p2p-market.dc.html', d: 'M4 8h13l-3-3M20 16H7l3 3' },
      { key: 'analytics', label: this.tr('Аналитика'), href: 'ios-analytics.dc.html', d: 'M4 19h16M6 15l4-5 3 3 5-7' },
      { key: 'notifications', label: this.tr('Уведомления'), href: 'ios-notifications.dc.html', d: 'M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0', dot: true },
      { key: 'profile', label: this.tr('Профиль'), href: 'ios-profile.dc.html', d: 'M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5' }
    ];
    return {
      items: items.map((n) => ({ ...n, on: n.key === active, off: n.key !== active, dot: !!n.dot, aria: n.dot ? n.label + this.tr(', есть новые') : n.label }))
    };
  }
}
</script>
</body>
</html>
