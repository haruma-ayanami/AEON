ntent: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button></header>

<sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 12px">
    <div style="border-radius: 24px; background: var(--surface); overflow: hidden"><sc-for list="{{ items }}" as="n" hint-placeholder-count="5"><a href="{{ n.href }}" style="min-height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--t1); border-bottom: 1px solid var(--bs); align-items: flex-start; padding-top: 14px; padding-bottom: 14px; background: {{ n.bg }}"><span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: {{ n.ib }}; color: {{ n.ic }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: {{ n.w }}">{{ n.t }}</span><span class="faint" style="font-size: 12px">{{ n.time }}</span></span><span class="muted" style="font-size: 13px; line-height: 18px">{{ n.s }}</span></span></a></sc-for></div>
    </div></sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 12px"><div style="padding: 36px 20px 28px; border-radius: 24px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><span aria-hidden="true" class="dots" style="width: 72px; height: 72px; border-radius: 22px; border: 1px dashed var(--bst); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg></span><span style="font-weight: 600; font-size: 17px">{{ L.k23 }}</span><span style="font-size: 14px; line-height: 20px; color: var(--t2); max-width: 420px">{{ L.k24 }}</span><a href="and-profile.dc.html" class="btn" style="height: 48px; padding: 0 22px; margin-top: 6px; font-size: 14px">{{ L.k25 }}</a></div></div></sc-if>

  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="AndNav" active="notifications" hint-size="412px,80px"></dc-import></div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 412, "height": 915}}'>

  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Уведомления"), k2: this.tr("Прочитать все"), k3: this.tr("Язык интерфейса: русский. Переключить на английский"), k4: this.tr("Все"), k5: this.tr("Сделки"), k6: this.tr("Кошелёк"), k7: this.tr("Безопасность"), k8: this.tr("Продавец ждёт оплату"), k9: this.tr("P2P-48213 · осталось 04:12"), k10: this.tr("2 мин"), k11: this.tr("Покупатель отметил оплату"), k12: this.tr("P2P-48216 · проверьте 9 240 ₽"), k13: this.tr("6 мин"), k14: this.tr("Депозит обнаружен"), k15: this.tr("+0,05 ETH · подтверждения 3/12"), k16: this.tr("9 мин"), k17: this.tr("Вход с нового устройства"), k18: this.tr("Windows 11 · Москва. Не вы? Завершите сессию."), k19: this.tr("42 мин"), k20: this.tr("Вывод выполнен"), k21: this.tr("−250 USDT · Ledger тест"), k22: this.tr("вчера"), k23: this.tr("Новых уведомлений нет"), k24: this.tr("Сюда придут зачисления, этапы сделок P2P и предупреждения безопасности. Важное продублируем пуш-уведомлением."), k25: this.tr("Настроить уведомления"), kh: this.tr("Подсказка по разделу") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    const chip = (l, on) => ({ l, bd: on ? 'transparent' : 'var(--bst)', bg: on ? 'var(--sigs)' : 'transparent', fg: on ? 'var(--sigt)' : 'var(--t1)' });
    const n = (t, s, time, href, d, ib, ic, unread) => ({ t, s, time, href, d, ib, ic, w: unread ? '600' : '500', bg: unread ? 'var(--sel)' : 'transparent' });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark', isDefault: st === 'default', isEmpty: st === 'empty',
      chips: [chip(this.tr("Все"), true), chip(this.tr("Сделки")), chip(this.tr("Кошелёк")), chip(this.tr("Безопасность"))],
      items: [n(this.tr("Продавец ждёт оплату"), this.tr("P2P-48213 · осталось 04:12"), this.tr("2 мин"), 'and-p2p-deal.dc.html', 'M4 8h13l-3-3M20 16H7l3 3', 'var(--warns)', 'var(--warn)', true),
        n(this.tr("Покупатель отметил оплату"), this.tr("P2P-48216 · проверьте 9 240 ₽"), this.tr("6 мин"), 'and-p2p-deal-seller.dc.html', 'M5 12l5 5 9-10', 'var(--sigs)', 'var(--sigt)', true),
        n(this.tr("Депозит обнаружен"), this.tr("+0,05 ETH · подтверждения 3/12"), this.tr("9 мин"), 'and-tx-detail.dc.html', 'M17 7L7 17M7 9v8h8', 'var(--infos)', 'var(--info)', true),
        n(this.tr("Вход с нового устройства"), this.tr("Windows 11 · Москва. Не вы? Завершите сессию."), this.tr("42 мин"), '#', 'M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6z', 'var(--negs)', 'var(--neg)', false),
        n(this.tr("Вывод выполнен"), this.tr("−250 USDT · Ledger тест"), this.tr("вчера"), '#', 'M5 12l5 5 9-10', 'var(--raised)', 'var(--t2)', false)]
    };
  }
}
</script>
