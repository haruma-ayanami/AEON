<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 412, "height": 915}}'>
class Component extends DCLogic {
  static EN = {"Назад": "Back", "Получить": "Receive", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Актив": "Asset", "Сеть": "Network", "QR-код адреса": "Address QR code", "Только USDT в сети Sepolia. Минимум 1 USDT, зачисление после 12 подтверждений.": "Only USDT on the Sepolia network. Minimum 1 USDT, credited after 12 confirmations.", "Поделиться": "Share", "Копировать адрес": "Copy address"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Назад"), k2: this.tr("Получить"), k3: this.tr("Язык интерфейса: русский. Переключить на английский"), k4: this.tr("Актив"), k5: this.tr("Сеть"), k6: this.tr("QR-код адреса"), k7: this.tr("Только USDT в сети Sepolia. Минимум 1 USDT, зачисление после 12 подтверждений."), k8: this.tr("Поделиться"), k9: this.tr("Копировать адрес") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    let s = 23;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const qr = [];
    const fin = (r, c) => { for (const [r0, c0] of [[0, 0], [0, 18], [18, 0]]) { if (r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7) { const a = r - r0, b = c - c0; return (a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4)) ? 1 : 0; } if (r >= r0 - 1 && r <= r0 + 7 && c >= c0 - 1 && c <= c0 + 7) return 0; } return -1; };
    for (let r = 0; r < 25; r++) for (let c = 0; c < 25; c++) { const f = fin(r, c); qr.push((f === -1 ? rnd() > 0.52 : f === 1) ? '#0A0C0B' : '#FFFFFF'); }
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      qr
    };
  }
}
</script>
