<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS Admin — алерты</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="mob {{ themeClass }} phone">
  <div class="ios-body" style="top: 116px">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><sc-for list="{{ quick }}" as="q" hint-placeholder-count="4"><a href="{{ q.href }}" class="icard" style="padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--t1)"><span class="lbl" style="font-size: 10px">{{ q.l }}</span><span class="disp" style="font-size: 26px; color: {{ q.c }}">{{ q.v }}</span><span class="faint" style="font-size: 11px">{{ q.n }}</span></a></sc-for></div>
    <span class="lbl" style="padding: 6px 4px 0">{{ L.k1 }}</span>
    <sc-for list="{{ alerts }}" as="a" hint-placeholder-count="3"><a href="{{ a.href }}" class="icard" style="padding: 14px 16px; display: flex; gap: 12px; text-decoration: none; color: var(--t1); border: 1px solid {{ a.bc }}"><span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 12px; background: {{ a.ib }}; color: {{ a.ic }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.d }}"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{ a.t }}</span><span class="faint" style="font-size: 12px">{{ a.time }}</span></span><span class="muted" style="font-size: 13px; line-height: 18px">{{ a.s }}</span></span></a></sc-for>
    <span class="hint" style="padding: 0 4px">{{ L.k2 }}</span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(180deg, var(--fade) 70%, transparent)"></div>
  <div class="ios-nav" style="align-items: flex-start"><span style="flex: 1; min-width: 0; padding-top: 2px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span class="disp" style="max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 30px; line-height: 36px">{{ L.k3 }}</span><span style="display: flex; align-items: center; gap: 6px"><span class="testnet" style="height: 18px; padding: 0 7px">TESTNET</span><span style="height: 18px; padding: 0 7px; box-sizing: border-box; border-radius: 999px; border: 1px solid var(--bd); font: 500 10px 'JetBrains Mono', monospace; letter-spacing: .06em; color: var(--t2); display: inline-flex; align-items: center">ADMIN</span></span></span><button onClick="{{ toggleLang }}" aria-label="{{ L.k4 }}" style="height: 44px; padding: 4px; flex: none; box-sizing: border-box; border-radius: 999px; border: 0.5px solid var(--glb); background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh); display: flex; gap: 2px; cursor: pointer; font: 600 11px 'JetBrains Mono', monospace"><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button><button aria-label="{{ L.kh }}" class="gbtn glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg></button></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(180deg, transparent, var(--fade))"></div><nav aria-label="{{ L.k5 }}" class="glass" style="position: absolute; left: 16px; right: 16px; bottom: 30px; height: 62px; border-radius: 999px; padding: 5px; box-sizing: border-box; display: flex; gap: 4px"><a href="iadm-alerts.dc.html" aria-current="page" style="position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--pfg); background: var(--pbg); font: 600 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>{{ L.k3 }}<span style="position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">3</span></a><a href="iadm-withdrawals.dc.html" style="position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); background: transparent; font: 500 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>{{ L.k6 }}<span style="position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">6</span></a><a href="iadm-disputes.dc.html" style="position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); background: transparent; font: 500 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>{{ L.k7 }}<span style="position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--warn); color: var(--onacc, #0A0C0B); font: 600 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">4</span></a><button type="button" style="border: 0; background: transparent; font: inherit; color: inherit; text-align: inherit; cursor: pointer; padding: 0; position: relative; flex: 1; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--t1); background: transparent; font: 500 10px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>{{ L.k8 }}</button></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  static EN = {"Подсказка по разделу": "Section help", "АКТИВНЫЕ АЛЕРТЫ · 3": "ACTIVE ALERTS · 3", "Справочники, роли и решения по спорам — только в веб-панели и на компьютере.": "Reference data, roles and dispute decisions are only in the web panel and on desktop.", "Алерты": "Alerts", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Разделы админки": "Admin sections", "Выводы": "Withdrawals", "Споры": "Disputes", "Ещё": "More", "ВЫВОДЫ": "WITHDRAWALS", "старшему 1 ч 42 мин": "oldest 1 h 42 min", "СПОРЫ": "DISPUTES", "1 с ответом < 3 ч": "1 with reply due < 3 h", "ДЕПОЗИТЫ": "DEPOSITS", "на $6 140": "worth $6,140", "СДЕЛКИ": "DEALS", "9 ждут выпуска": "9 awaiting release", "RPC-узел Sepolia недоступен": "Sepolia RPC node down", "Работает резервный. Сканер отстаёт на 4 блока.": "The backup is running. The scanner is 4 blocks behind.", "6 мин": "6 min", "Сканер Solana отстаёт": "Solana scanner lagging", "214 слотов · депозиты SOL зачисляются с задержкой": "214 slots · SOL deposits are credited with a delay", "12 мин": "12 min", "Расхождение сверки ETH": "ETH reconciliation mismatch", "−0,0021 ETH · комиссия вывода W-90388 в пути": "−0.0021 ETH · fee for withdrawal W-90388 in transit", "21 мин": "21 min"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("АКТИВНЫЕ АЛЕРТЫ · 3"), k2: this.tr("Справочники, роли и решения по спорам — только в веб-панели и на компьютере."), k3: this.tr("Алерты"), k4: this.tr("Язык интерфейса: русский. Переключить на английский"), k5: this.tr("Разделы админки"), k6: this.tr("Выводы"), k7: this.tr("Споры"), k8: this.tr("Ещё"), k9: this.tr("ВЫВОДЫ"), k10: this.tr("старшему 1 ч 42 мин"), k11: this.tr("СПОРЫ"), k12: this.tr("1 с ответом < 3 ч"), k13: this.tr("ДЕПОЗИТЫ"), k14: this.tr("на $6 140"), k15: this.tr("СДЕЛКИ"), k16: this.tr("9 ждут выпуска"), k17: this.tr("RPC-узел Sepolia недоступен"), k18: this.tr("Работает резервный. Сканер отстаёт на 4 блока."), k19: this.tr("6 мин"), k20: this.tr("Сканер Solana отстаёт"), k21: this.tr("214 слотов · депозиты SOL зачисляются с задержкой"), k22: this.tr("12 мин"), k23: this.tr("Расхождение сверки ETH"), k24: this.tr("−0,0021 ETH · комиссия вывода W-90388 в пути"), k25: this.tr("21 мин"), kh: this.tr("Подсказка по разделу") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const q = (l, v, n, c, href) => ({ l, v, n, c, href });
    const a = (t, s, time, d, kind, href) => ({ t, s, time, d, href: href || '#', ib: kind === 'neg' ? 'var(--negs)' : 'var(--warns)', ic: kind === 'neg' ? 'var(--neg)' : 'var(--warn)', bc: kind === 'neg' ? 'var(--neg)' : 'var(--bs)' });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      quick: [q(this.tr("ВЫВОДЫ"), '6', this.tr("старшему 1 ч 42 мин"), 'var(--warn)', 'iadm-withdrawals.dc.html'), q(this.tr("СПОРЫ"), '4', this.tr("1 с ответом < 3 ч"), 'var(--neg)', 'iadm-disputes.dc.html'), q(this.tr("ДЕПОЗИТЫ"), '2', this.tr("на $6 140"), 'var(--warn)', '#'), q(this.tr("СДЕЛКИ"), '30', this.tr("9 ждут выпуска"), 'var(--t1)', '#')],
      alerts: [a(this.tr("RPC-узел Sepolia недоступен"), this.tr("Работает резервный. Сканер отстаёт на 4 блока."), this.tr("6 мин"), 'M12 3l10 17H2zM12 10v4M12 17v.5', 'neg'), a(this.tr("Сканер Solana отстаёт"), this.tr("214 слотов · депозиты SOL зачисляются с задержкой"), this.tr("12 мин"), 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 7v5l3 2', 'warn'), a(this.tr("Расхождение сверки ETH"), this.tr("−0,0021 ETH · комиссия вывода W-90388 в пути"), this.tr("21 мин"), 'M4 6h16M4 12h10M4 18h7', 'warn')]
    };
  }
}
</script>
</body>
</html>
