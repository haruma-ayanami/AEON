<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>iOS — мои сделки</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="mob {{ themeClass }} phone">
  <div class="ios-body" style="top: 116px">
    <div role="tablist" aria-label="{{ L.k1 }}" class="glass" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 999px"><button role="tab" aria-selected="true" class="btn btn-p" style="height: 36px; font-size: 14px">{{ tabActive }}</button><button role="tab" aria-selected="false" class="btn" style="height: 36px; font-size: 14px; background: transparent">{{ L.k3 }}</button><button role="tab" aria-selected="false" class="btn" style="height: 36px; font-size: 14px; background: transparent">{{ tabDisp }}</button></div>
<sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{ deals }}" as="d" hint-placeholder-count="2">
      <a href="{{ d.href }}" class="icard" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--t1); border: 1px solid {{ d.bc }}">
        <span style="display: flex; justify-content: space-between; align-items: center"><span class="lbl">{{ d.id }} · {{ d.role }}</span><span class="mono" style="color: {{ d.tc }}">{{ d.timer }}</span></span>
        <span class="disp" style="font-size: 22px">{{ d.amt }}</span>
        <span class="muted" style="font-size: 13px">{{ d.meta }}</span>
        <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; height: 5px"><sc-for list="{{ d.bars }}" as="b" hint-placeholder-count="30"><span style="border-radius: 1px; background: {{ b }}"></span></sc-for></span>
        <span style="display: flex; justify-content: space-between; align-items: center"><span class="chip {{ d.cls }}">{{ d.status }}</span><span style="font-weight: 600; font-size: 14px">{{ d.next }}</span></span>
      </a>
    </sc-for>
    <span class="lbl" style="padding: 6px 4px 0">{{ L.k5 }}</span>
    <div class="icard"><sc-for list="{{ done }}" as="x" hint-placeholder-count="2"><a href="st-ios-p2p-deal-completed.dc.html" class="irow" style="min-height: 60px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{ x.t }}</span><span class="faint" style="font-size: 12px">{{ x.s }}</span></span><span class="chip c-ok">{{ L.k6 }}</span></a></sc-for></div></div></sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding: 40px 20px 22px; border-radius: 22px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><span aria-hidden="true" class="dots" style="width: 72px; height: 72px; border-radius: 22px; border: 1px dashed var(--bst); display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg></span><span style="font-weight: 600; font-size: 17px">{{ L.k25 }}</span><span style="font-size: 14px; line-height: 20px; color: var(--t2); max-width: 420px">{{ L.k26 }}</span><span style="display: flex; flex-direction: column; gap: 8px; align-self: stretch; margin-top: 8px"><a href="ios-p2p-market.dc.html" style="height: 48px; padding: 0 20px; border-radius: 999px; font: 600 15px Inter, sans-serif; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; background: var(--pbg); color: var(--pfg)">{{ L.k27 }}</a><a href="ios-p2p-create-offer.dc.html" style="height: 48px; padding: 0 20px; border-radius: 999px; font: 600 15px Inter, sans-serif; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; background: var(--raised); color: var(--t1)">{{ L.k28 }}</a></span></div></sc-if>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(180deg, var(--fade) 70%, transparent)"></div>
  <div class="ios-nav"><a href="ios-p2p-market.dc.html" aria-label="{{ L.k7 }}" class="gbtn glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><span class="ios-title" style="min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ L.k8 }}</span><span class="testnet" style="height: 18px; padding: 0 7px">TESTNET</span></span><button onClick="{{ toggleLang }}" aria-label="{{ L.k9 }}" style="height: 44px; padding: 4px; flex: none; box-sizing: border-box; border-radius: 999px; border: 0.5px solid var(--glb); background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: inset 0 1px 0 var(--glh); display: flex; gap: 2px; cursor: pointer; font: 600 11px 'JetBrains Mono', monospace"><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lruBg }}; color: {{ lruFg }}">RU</span><span style="min-width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ lenBg }}; color: {{ lenFg }}">EN</span></button></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="IosTabBar" active="p2p" hint-size="390px,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "state": {"editor": "enum", "options": ["default", "empty"], "default": "default"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  static EN = {"Сделки": "Deals", "Язык интерфейса: русский. Переключить на английский": "Interface language: English. Switch to Russian", "Оплата отправлена": "Payment sent", "Средства в эскроу": "Funds in escrow", "Завершена": "Completed", "Назад": "Back", "250,00 USDT": "250.00 USDT", "Мои сделки": "My deals", "История": "History", "Активные 2": "Active 2", "Споры 1": "Disputes 1", "НЕДАВНО ЗАВЕРШЕНЫ": "RECENTLY COMPLETED", "ПОКУПКА": "BUY", "у crypto_mila · 23 100 ₽": "from crypto_mila · 23,100 ₽", "Оплатить →": "Pay →", "ПРОДАЖА": "SELL", "100,00 USDT": "100.00 USDT", "покупатель eva_s · 9 240 ₽": "buyer eva_s · 9,240 ₽", "Проверить →": "Check →", "Продажа 100 USDT · eva_s": "Sold 100 USDT · eva_s", "P2P-47812 · вчера · отзыв оставлен": "P2P-47812 · yesterday · review left", "Покупка 500 USDT · crypto_mila": "Bought 500 USDT · crypto_mila", "Активные": "Active", "Споры": "Disputes", "Активных сделок нет": "No active deals", "Купите или продайте USDT на маркетплейсе — сделка появится здесь с таймером и статусом.": "Buy or sell USDT on the marketplace — the deal will appear here with a timer and status.", "Открыть маркетплейс": "Open marketplace", "Создать объявление": "Create offer"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("Сделки"), k2: this.tr("Активные 2"), k3: this.tr("История"), k4: this.tr("Споры 1"), k5: this.tr("НЕДАВНО ЗАВЕРШЕНЫ"), k6: this.tr("Завершена"), k7: this.tr("Назад"), k8: this.tr("Мои сделки"), k9: this.tr("Язык интерфейса: русский. Переключить на английский"), k10: this.tr("ПОКУПКА"), k11: this.tr("250,00 USDT"), k12: this.tr("у crypto_mila · 23 100 ₽"), k13: this.tr("Средства в эскроу"), k14: this.tr("Оплатить →"), k15: this.tr("ПРОДАЖА"), k16: this.tr("100,00 USDT"), k17: this.tr("покупатель eva_s · 9 240 ₽"), k18: this.tr("Оплата отправлена"), k19: this.tr("Проверить →"), k20: this.tr("Продажа 100 USDT · eva_s"), k21: this.tr("P2P-47812 · вчера · отзыв оставлен"), k22: this.tr("Покупка 500 USDT · crypto_mila"), k23: this.tr("Активные"), k24: this.tr("Споры"), k25: this.tr("Активных сделок нет"), k26: this.tr("Купите или продайте USDT на маркетплейсе — сделка появится здесь с таймером и статусом."), k27: this.tr("Открыть маркетплейс"), k28: this.tr("Создать объявление") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.props.state ?? 'default';
    const bars = (n, c) => Array.from({ length: 30 }, (_, i) => (i < n ? c : 'var(--bd)'));
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark', isDefault: st === 'default', isEmpty: st === 'empty', tabActive: st === 'empty' ? this.tr("Активные") : this.tr('Активные 2'), tabDisp: st === 'empty' ? this.tr("Споры") : this.tr('Споры 1'),
      deals: [
        { id: 'P2P-48213', href: 'ios-p2p-deal.dc.html', role: this.tr('ПОКУПКА'), timer: '04:12', tc: 'var(--warn)', amt: this.tr('250,00 USDT'), meta: this.tr('у crypto_mila · 23 100 ₽'), bars: bars(9, 'var(--warn)'), status: this.tr('Средства в эскроу'), cls: 'c-info', next: this.tr('Оплатить →'), bc: 'var(--warn)' },
        { id: 'P2P-48216', href: 'ios-p2p-deal-seller.dc.html', role: this.tr('ПРОДАЖА'), timer: '12:05', tc: 'var(--t1)', amt: this.tr('100,00 USDT'), meta: this.tr('покупатель eva_s · 9 240 ₽'), bars: bars(24, 'var(--sig)'), status: this.tr('Оплата отправлена'), cls: 'c-warn', next: this.tr('Проверить →'), bc: 'var(--bs)' }
      ],
      done: [{ t: this.tr('Продажа 100 USDT · eva_s'), s: this.tr('P2P-47812 · вчера · отзыв оставлен') }, { t: this.tr('Покупка 500 USDT · crypto_mila'), s: 'P2P-47790 · 20.10' }]
    };
  }
}
</script>
</body>
</html>
