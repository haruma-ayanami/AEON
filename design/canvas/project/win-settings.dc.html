<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AEON для Windows — настройки</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="{{ themeClass }} wwin" style="width: 1440px; height: 900px">
  <dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="WinTitleBar" heading="{{ L.k1 }}" hint-size="1440px,48px"></dc-import>
  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="WinNav" active="profile" hint-size="220px,852px"></dc-import>
    <main class="wlayer" style="flex-direction: row">
      <nav aria-label="{{ L.k2 }}" style="width: 260px; flex: none; padding: 22px 12px; border-right: 1px solid var(--bs); display: flex; flex-direction: column; gap: 2px">
        <h1 class="disp" style="margin: 0 0 14px 10px; font-size: 26px">{{ L.k3 }}</h1>
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="7"><a href="win-settings.dc.html" aria-current="{{ c.cur }}" style="position: relative; height: 36px; padding: 0 12px; border-radius: 4px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--t1); background: {{ c.bg }}; font: {{ c.font }}"><sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--sig)"></span></sc-if><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.d }}"></path></svg>{{ c.l }}</a></sc-for>
      </nav>
      <div style="flex: 1; min-width: 0; padding: 22px 28px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
        <h2 class="disp" style="margin: 0 0 8px; font-size: 22px">{{ L.k4 }}</h2>
        <sc-for list="{{ cards }}" as="s" hint-placeholder-count="6">
          <div class="wcard" style="min-height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 16px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.d }}"></path></svg>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>{{ s.t }}</span><span class="muted" style="font-size: 12px">{{ s.desc }}</span></span>
            <sc-if value="{{ s.isSw }}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 10px" class="muted">{{ s.state }}<span class="sw {{ s.sw }}" aria-hidden="true" style="width: 40px; height: 20px"></span></span></sc-if>
            <sc-if value="{{ s.isSel }}" hint-placeholder-val="{{ false }}"><button class="wbtn" style="min-width: 160px; justify-content: space-between">{{ s.state }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
          </div>
        </sc-for>
        <h2 class="disp" style="margin: 16px 0 8px; font-size: 18px">{{ L.k5 }}</h2>
        <div class="wcard" style="padding: 4px 16px">
          <sc-for list="{{ keys }}" as="k" hint-placeholder-count="6"><div style="display: flex; justify-content: space-between; align-items: center; height: 38px; border-bottom: 1px solid {{ k.line }}"><span>{{ k.t }}</span><span style="display: flex; gap: 4px"><sc-for list="{{ k.k }}" as="x" hint-placeholder-count="2"><span class="mono" style="min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid var(--bd); border-bottom-width: 2px; font-size: 11px; display: inline-flex; align-items: center; justify-content: center">{{ x }}</span></sc-for></span></div></sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  static EN = {"Справка по разделу": "Section help", "Профиль": "Profile", "Безопасность": "Security", "Приложение": "App", "Получить": "Receive", "Отправить": "Send", "Уведомления": "Notifications", "Новое объявление": "New offer", "Настройки": "Settings", "Запускать вместе с Windows": "Start with Windows", "AEON · Настройки": "AEON · Settings", "Категории настроек": "Settings categories", "Горячие клавиши": "Keyboard shortcuts", "Внешний вид": "Appearance", "Язык и регион": "Language and region", "О программе": "About", "Вкл.": "On", "Откл.": "Off", "AEON откроется свёрнутым в области уведомлений": "AEON will open minimized to the notification area", "Сворачивать в трей при закрытии": "Minimize to tray on close", "Уведомления о сделках продолжат приходить": "Deal notifications will keep coming", "Уведомления Windows": "Windows notifications", "Статус сделки, депозиты и выводы в центре уведомлений": "Deal status, deposits and withdrawals in the notification center", "Окно сделки": "Deal window", "Как открывать сделки P2P": "How to open P2P deals", "Отдельное окно": "Separate window", "Блокировать при бездействии": "Lock when idle", "Через 15 минут потребуется Windows Hello": "Windows Hello will be required after 15 minutes", "Обновления": "Updates", "Версия 0.9.2 · тестовый канал": "Version 0.9.2 · test channel", "Автоматически": "Automatically", "Поиск и команды": "Search and commands", "Заблокировать AEON": "Lock AEON"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("AEON · Настройки"), k2: this.tr("Категории настроек"), k3: this.tr("Настройки"), k4: this.tr("Приложение"), k5: this.tr("Горячие клавиши"), k6: this.tr("Профиль"), k7: this.tr("Безопасность"), k8: this.tr("Уведомления"), k9: this.tr("Внешний вид"), k10: this.tr("Язык и регион"), k11: this.tr("О программе"), k12: this.tr("Вкл."), k13: this.tr("Откл."), k14: this.tr("Запускать вместе с Windows"), k15: this.tr("AEON откроется свёрнутым в области уведомлений"), k16: this.tr("Сворачивать в трей при закрытии"), k17: this.tr("Уведомления о сделках продолжат приходить"), k18: this.tr("Уведомления Windows"), k19: this.tr("Статус сделки, депозиты и выводы в центре уведомлений"), k20: this.tr("Окно сделки"), k21: this.tr("Как открывать сделки P2P"), k22: this.tr("Отдельное окно"), k23: this.tr("Блокировать при бездействии"), k24: this.tr("Через 15 минут потребуется Windows Hello"), k25: this.tr("Обновления"), k26: this.tr("Версия 0.9.2 · тестовый канал"), k27: this.tr("Автоматически"), k28: this.tr("Поиск и команды"), k29: this.tr("Отправить"), k30: this.tr("Получить"), k31: this.tr("Новое объявление"), k32: this.tr("Справка по разделу"), k33: this.tr("Заблокировать AEON") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const cats = [
      [this.tr('Профиль'), 'M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5'],
      [this.tr('Безопасность'), 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3'],
      [this.tr('Уведомления'), 'M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0'],
      [this.tr('Внешний вид'), 'M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z'],
      [this.tr('Язык и регион'), 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M3 12h18'],
      [this.tr('Приложение'), 'M3 5h18v11H3zM8 20h8M12 16v4', true],
      [this.tr('О программе'), 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 11v6M12 7.5v.5']
    ].map(([l, d, on]) => ({ l, d, on: !!on, cur: on ? 'page' : 'false', bg: on ? 'var(--wsel)' : 'transparent', font: on ? '600 13px Inter, sans-serif' : '400 13px Inter, sans-serif' }));
    const sw = (t, desc, d, on) => ({ t, desc, d, isSw: true, isSel: false, sw: on ? 'on' : '', state: on ? this.tr('Вкл.') : this.tr('Откл.') });
    const sel = (t, desc, d, state) => ({ t, desc, d, isSw: false, isSel: true, state });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      cats,
      cards: [
        sw(this.tr('Запускать вместе с Windows'), this.tr('AEON откроется свёрнутым в области уведомлений'), 'M12 4v8M7 7a7 7 0 1 0 10 0', true),
        sw(this.tr('Сворачивать в трей при закрытии'), this.tr('Уведомления о сделках продолжат приходить'), 'M4 18h16M8 14l4 4 4-4', true),
        sw(this.tr('Уведомления Windows'), this.tr('Статус сделки, депозиты и выводы в центре уведомлений'), 'M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z', true),
        sel(this.tr('Окно сделки'), this.tr('Как открывать сделки P2P'), 'M4 5h16v14H4zM4 9h16', this.tr('Отдельное окно')),
        sw(this.tr('Блокировать при бездействии'), this.tr('Через 15 минут потребуется Windows Hello'), 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3', true),
        sel(this.tr('Обновления'), this.tr('Версия 0.9.2 · тестовый канал'), 'M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4', this.tr('Автоматически'))
      ],
      keys: [[this.tr('Поиск и команды'), ['Ctrl', 'K']], [this.tr('Отправить'), ['Ctrl', 'S']], [this.tr('Получить'), ['Ctrl', 'R']], [this.tr('Новое объявление'), ['Ctrl', 'N']], [this.tr('Справка по разделу'), ['F1']], [this.tr('Заблокировать AEON'), ['Ctrl', 'L']]].map(([t, k], i, a) => ({ t, k, line: i === a.length - 1 ? 'transparent' : 'var(--bs)' }))
    };
  }
}
</script>
</body>
</html>
