<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AEON Admin для Windows — модерация объявлений</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./aeon.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
</helmet>
<div class="{{ themeClass }} wwin" style="width: 1440px; height: 900px">
  <dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="WinTitleBar" account="admin" heading="{{ L.k1 }}" hint-size="1440px,48px"></dc-import>
  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import lang="{{ lang }}" on-lang="{{ toggleLang }}" name="WinAdminNav" active="offers" hint-size="220px,852px"></dc-import>
    <main class="wlayer">
      <div style="padding: 22px 28px 12px; display: flex; align-items: center; gap: 8px"><h1 class="disp" style="margin: 0; font-size: 28px; flex: 1">{{ L.k2 }}</h1></div>
      <div style="padding: 0 28px 12px; display: flex; gap: 8px"><div style="display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--ctrl); border: 1px solid var(--bs)"><button style="height: 28px; padding: 0 12px; border: 0; border-radius: 4px; font: 500 13px Inter, sans-serif; cursor: pointer; color: var(--t1); background: var(--wsel)">{{ L.k3 }}</button><button style="height: 28px; padding: 0 12px; border: 0; border-radius: 4px; font: 500 13px Inter, sans-serif; cursor: pointer; color: var(--t1); background: transparent">{{ L.k4 }}</button><button style="height: 28px; padding: 0 12px; border: 0; border-radius: 4px; font: 500 13px Inter, sans-serif; cursor: pointer; color: var(--t1); background: transparent">{{ L.k5 }}</button><button style="height: 28px; padding: 0 12px; border: 0; border-radius: 4px; font: 500 13px Inter, sans-serif; cursor: pointer; color: var(--t1); background: transparent">{{ L.k6 }}</button></div></div>
      <div style="flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--bs)">
        <div style="flex: 1; min-width: 0; overflow: hidden"><table class="tbl"><thead><tr><th>{{ L.k7 }}</th><th style="text-align: right">{{ L.k8 }}</th><th style="text-align: right">{{ L.k9 }}</th><th>{{ L.k10 }}</th><th>{{ L.k11 }}</th><th>{{ L.k12 }}</th></tr></thead><tbody><sc-for list="{{ rows }}" as="r" hint-placeholder-count="5"><tr aria-selected="{{ r.sel }}" style="background: {{ r.bg }}"><td><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{ r.who }}</span><span class="faint" style="font-size: 11px">{{ r.dir }}</span></span></td><td class="num" style="text-align: right; font-weight: 600">{{ r.p }}</td><td class="mono" style="text-align: right; font-size: 12px; color: {{ r.dc }}">{{ r.dev }}</td><td><span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 44px; height: 5px; border-radius: 3px; background: var(--bd); overflow: hidden"><span style="display: block; height: 100%; width: {{ r.rw }}; background: {{ r.rc }}"></span></span><span class="mono" style="font-size: 12px; color: {{ r.rc }}">{{ r.risk }}</span></span></td><td class="muted" style="font-size: 12px">{{ r.why }}</td><td class="muted" style="font-size: 12px">{{ r.at }}</td></tr></sc-for></tbody></table></div>
        <aside style="width: 380px; flex: none; border-left: 1px solid var(--bs); background: var(--card); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden"><span class="lbl">{{ L.k13 }}</span>
          <span style="display: flex; align-items: baseline; gap: 8px"><span class="disp" style="font-size: 26px">81,20 ₽</span><span class="muted">{{ L.k14 }}</span></span>
          <span class="muted" style="font-size: 12px; line-height: 17px">{{ L.k15 }}</span>
          <div style="padding: 10px 12px; border-radius: 4px; background: var(--raised); display: flex; flex-direction: column; gap: 6px"><span class="lbl" style="font-size: 10px">{{ L.k16 }}</span><span style="line-height: 18px">{{ L.k17 }} <mark style="background: var(--negs); color: var(--neg); padding: 0 3px">{{ L.k18 }}</mark>{{ L.k19 }}</span></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl" style="font-size: 10px">{{ L.k20 }}</span><sc-for list="{{ sig }}" as="s" hint-placeholder-count="3"><span style="display: flex; gap: 8px; font-size: 12px; line-height: 17px"><span aria-hidden="true" style="width: 7px; height: 7px; margin-top: 5px; flex: none; border-radius: 2px; background: {{ s.c }}"></span>{{ s.t }}</span></sc-for></div>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="muted">{{ L.k21 }}</span><span class="winp" style="height: 34px"><input defaultValue="{{ L.k22 }}" readonly><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></label>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span class="cb on" aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><input type="checkbox" checked class="sr">{{ L.k23 }}</label>
          <div style="flex: 1"></div>
          <div style="display: flex; gap: 6px"><button class="wbtn" style="flex: 1">{{ L.k24 }}</button><button class="wbtn wbtn-p" style="flex: 1">{{ L.k25 }}</button></div></aside>
      </div>
      <footer class="wstatus"><span>{{ L.k26 }}</span><span style="flex: 1"></span><span>{{ L.k27 }}</span></footer>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "lang": {"editor": "enum", "options": ["ru", "en"], "default": "ru"}, "$preview": {"width": 1440, "height": 900}}'>

  static EN = {"AEON Admin · Объявления": "AEON Admin · Offers", "Модерация объявлений": "Offer moderation", "На проверке · 5": "Under review · 5", "Жалобы · 1": "Complaints · 1", "Скрытые · 12": "Hidden · 12", "Все": "All", "ПРОДАВЕЦ": "SELLER", "КУРС": "RATE", "ОТКЛОНЕНИЕ": "DEVIATION", "РИСК": "RISK", "ПРИЧИНА ПРОВЕРКИ": "REVIEW REASON", "СОЗДАНО": "CREATED", "ОБЪЯВЛЕНИЕ · FAST_CASH_99": "OFFER · FAST_CASH_99", "за 1 USDT · −12,1% к рынку": "per 1 USDT · −12.1% vs market", "Доступно 25 000 USDT · лимиты 50 000 – 2 000 000 ₽ · СБП": "Available 25,000 USDT · limits 50,000 – 2,000,000 ₽ · SBP", "УСЛОВИЯ ПРОДАВЦА": "SELLER'S TERMS", "Быстрый обмен без верификации. Для крупных сумм пишите в": "Fast exchange without verification. For large amounts write to", "телеграм @fastcash": "telegram @fastcash", ", сделаем дешевле.": ", we'll make it cheaper.", "СИГНАЛЫ": "SIGNALS", "Причина скрытия": "Reason for hiding", "Увод сделок за пределы платформы": "Taking deals off the platform", "Приостановить остальные объявления продавца": "Pause the seller's other offers", "Вернуть в ленту": "Return to feed", "Скрыть · Ctrl+H": "Hide · Ctrl+H", "5 НА ПРОВЕРКЕ · СРЕДНЕЕ ВРЕМЯ РЕШЕНИЯ 14 МИН": "5 UNDER REVIEW · AVERAGE DECISION TIME 14 MIN", "CTRL+H — СКРЫТЬ · CTRL+R — ВЕРНУТЬ": "CTRL+H — HIDE · CTRL+R — RETURN", "Продажа USDT": "Selling USDT", "81,20 ₽": "81.20 ₽", "Курс сильно ниже рынка, контакт в условиях": "Rate far below market, contact in terms", "12 мин": "12 min", "91,90 ₽": "91.90 ₽", "Первое объявление нового продавца": "New seller's first offer", "34 мин": "34 min", "Покупка BTC": "Buying BTC", "7 120 000 ₽": "7,120,000 ₽", "Жалоба покупателя: «не отвечает»": "Buyer's complaint: “not responding”", "1 ч": "1 h", "Продажа ETH": "Selling ETH", "318 400 ₽": "318,400 ₽", "Объём выше лимита KYC 1": "Volume above KYC 1 limit", "2 ч": "2 h", "92,10 ₽": "92.10 ₽", "Слова-триггеры в условиях": "Trigger words in terms", "3 ч": "3 h", "Контакт вне платформы нарушает правила P2P (п. 4.2)": "Off-platform contact violates P2P rules (4.2)", "Курс на 12% ниже рынка — типичная приманка": "12% below market — a typical lure", "Риск продавца 91: 82% завершённых сделок": "Seller risk 91: 82% completed deals"};
  tr(s) { return this._lang === 'en' && Component.EN[s] != null ? Component.EN[s] : s; }
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.lang || 'ru';
    this._lang = lang;
    const v = this._vals();
    const on = (x) => (lang === x ? 'var(--pbg, #F2F5F1)' : 'transparent');
    const fg = (x) => (lang === x ? 'var(--pfg, #0A0C0B)' : 'var(--t2, #A3ACA5)');
    v.L = { k1: this.tr("AEON Admin · Объявления"), k2: this.tr("Модерация объявлений"), k3: this.tr("На проверке · 5"), k4: this.tr("Жалобы · 1"), k5: this.tr("Скрытые · 12"), k6: this.tr("Все"), k7: this.tr("ПРОДАВЕЦ"), k8: this.tr("КУРС"), k9: this.tr("ОТКЛОНЕНИЕ"), k10: this.tr("РИСК"), k11: this.tr("ПРИЧИНА ПРОВЕРКИ"), k12: this.tr("СОЗДАНО"), k13: this.tr("ОБЪЯВЛЕНИЕ · FAST_CASH_99"), k14: this.tr("за 1 USDT · −12,1% к рынку"), k15: this.tr("Доступно 25 000 USDT · лимиты 50 000 – 2 000 000 ₽ · СБП"), k16: this.tr("УСЛОВИЯ ПРОДАВЦА"), k17: this.tr("Быстрый обмен без верификации. Для крупных сумм пишите в"), k18: this.tr("телеграм @fastcash"), k19: this.tr(", сделаем дешевле."), k20: this.tr("СИГНАЛЫ"), k21: this.tr("Причина скрытия"), k22: this.tr("Увод сделок за пределы платформы"), k23: this.tr("Приостановить остальные объявления продавца"), k24: this.tr("Вернуть в ленту"), k25: this.tr("Скрыть · Ctrl+H"), k26: this.tr("5 НА ПРОВЕРКЕ · СРЕДНЕЕ ВРЕМЯ РЕШЕНИЯ 14 МИН"), k27: this.tr("CTRL+H — СКРЫТЬ · CTRL+R — ВЕРНУТЬ"), k28: this.tr("Продажа USDT"), k29: this.tr("81,20 ₽"), k30: this.tr("Курс сильно ниже рынка, контакт в условиях"), k31: this.tr("12 мин"), k32: this.tr("91,90 ₽"), k33: this.tr("Первое объявление нового продавца"), k34: this.tr("34 мин"), k35: this.tr("Покупка BTC"), k36: this.tr("7 120 000 ₽"), k37: this.tr("Жалоба покупателя: «не отвечает»"), k38: this.tr("1 ч"), k39: this.tr("Продажа ETH"), k40: this.tr("318 400 ₽"), k41: this.tr("Объём выше лимита KYC 1"), k42: this.tr("2 ч"), k43: this.tr("92,10 ₽"), k44: this.tr("Слова-триггеры в условиях"), k45: this.tr("3 ч"), k46: this.tr("Контакт вне платформы нарушает правила P2P (п. 4.2)"), k47: this.tr("Курс на 12% ниже рынка — типичная приманка"), k48: this.tr("Риск продавца 91: 82% завершённых сделок") };
    v.lang = lang;
    v.lruBg = on('ru'); v.lruFg = fg('ru'); v.lenBg = on('en'); v.lenFg = fg('en');
    v.toggleLang = this.props.onLang || (() => this.setState({ lang: lang === 'ru' ? 'en' : 'ru' }));
    return v;
  }

  _vals() {
    const theme = this.props.theme ?? 'dark';
    const sel = (i, j) => (i === j ? { sel: 'true', bg: 'var(--wsel)' } : { sel: 'false', bg: 'transparent' });
    const rc = (r) => (r >= 85 ? 'var(--neg)' : r >= 60 ? 'var(--orange, #FF9A5B)' : r >= 25 ? 'var(--warn)' : 'var(--sigt)');
    const o = (i, who, dir, p, dev, risk, why, at) => ({ ...sel(i, 0), who, dir, p, dev, dc: dev.startsWith('−') && parseFloat(dev.replace('−', '').replace(',', '.')) > 5 ? 'var(--neg)' : 'var(--t2)', risk: String(risk), rw: risk + '%', rc: rc(risk), why, at });
    return {
      themeClass: theme === 'light' ? 'th-light' : 'th-dark',
      rows: [o(0, 'fast_cash_99', this.tr("Продажа USDT"), this.tr("81,20 ₽"), '−12,1%', 91, this.tr("Курс сильно ниже рынка, контакт в условиях"), this.tr("12 мин")), o(1, 'newtrader_07', this.tr("Продажа USDT"), this.tr("91,90 ₽"), '−0,5%', 31, this.tr("Первое объявление нового продавца"), this.tr("34 мин")), o(2, 'gold_x', this.tr("Покупка BTC"), this.tr("7 120 000 ₽"), '+9,4%', 44, this.tr("Жалоба покупателя: «не отвечает»"), this.tr("1 ч")), o(3, 'mbtc', this.tr("Продажа ETH"), this.tr("318 400 ₽"), '+1,1%', 12, this.tr("Объём выше лимита KYC 1"), this.tr("2 ч")), o(4, 'shadow_t', this.tr("Продажа USDT"), this.tr("92,10 ₽"), '−0,3%', 58, this.tr("Слова-триггеры в условиях"), this.tr("3 ч"))],
      sig: [{ c: 'var(--neg)', t: this.tr("Контакт вне платформы нарушает правила P2P (п. 4.2)") }, { c: 'var(--warn)', t: this.tr("Курс на 12% ниже рынка — типичная приманка") }, { c: 'var(--warn)', t: this.tr("Риск продавца 91: 82% завершённых сделок") }]
    };
  }
}
</script>
</body>
</html>
